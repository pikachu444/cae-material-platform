[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "cae-material-platform"
version = "0.32.0"
description = "Material data management and CAE workflow platform with immutable provenance"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.42,<2",
  "cryptography>=48.0.1,<50",
  "fastapi>=0.139,<0.140",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13,<3",
  "pyarrow>=19,<25",
  "PyJWT[crypto]>=2.12,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.15,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.51,<0.52",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.14,<1",
  "types-jsonschema>=4.26,<5",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
cmp-api = "cmp.apps.api:main"
cmp-worker = "cmp.apps.worker:main"
cmp-demo-bootstrap = "cmp.apps.demo:main"
cmp-demo-seed = "cmp.apps.demo_seed:main"
cmp-plugin-runner = "cmp_plugin_sdk.runner:main"
cmp-check-architecture = "cmp.tools.architecture:main"
cmp-check-contracts = "cmp.tools.contracts:main"
cmp-check-user-guide = "cmp.tools.user_guide:main"
cmp-restore-drill = "cmp.tools.restore_drill:main"
cmp-release-quality = "cmp.tools.release_quality:main"
cmp-performance-acceptance = "cmp.tools.performance_acceptance:main"
cmp-performance-fixture = "cmp.tools.performance_fixture:main"
cmp-soak-fault-acceptance = "cmp.tools.soak_fault_acceptance:main"
cmp-governed-storage-acceptance = "cmp.tools.governed_storage_acceptance:main"
cmp-product-pilot-acceptance = "cmp.tools.product_pilot_acceptance:main"
cmp-generate-client = "cmp.tools.generate_client:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/cmp", "sdk/python/src/cmp_plugin_sdk"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["backend/src", "sdk/python/src", "generated/python"]
testpaths = ["backend/tests", "tests"]
markers = [
  "postgresql: requires CMP_TEST_POSTGRES_DSN and an isolated PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "sdk/python/src", "backend/tests", "tests"]
mypy_path = ["backend/src", "sdk/python/src", "generated/python"]
exclude = ["generated/"]
