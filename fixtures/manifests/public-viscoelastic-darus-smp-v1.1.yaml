  expected_experiment_count: 18
  expected_exact_temperature_frequency_group_count: 2
  frequency_group_key:
  - Result No.
  - Temperature
  frequency_columns:
    frequency: Frequency
    storage_modulus: Storage Modulus
    loss_modulus: Loss Modulus
  frequency_units:
    frequency: Hz
    storage_modulus: MPa
    loss_modulus: MPa
    temperature: C
  selection_rule: only a complete Result No. group with one exact published temperature text, at least three points, and strictly
    increasing positive frequency is calibration-eligible
  temperature_tolerance: not_defined_no_rows_are_merged
