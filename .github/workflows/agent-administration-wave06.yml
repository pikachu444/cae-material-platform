name: Complete issue 167 Administration references

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .agent/administration-wave06-ready

permissions:
  contents: write

concurrency:
  group: issue-167-administration-wave06-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  capture-and-commit:
    if: github.event.pull_request.head.ref == 'agent/complete-167-and-157'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pyyaml pytest ruff
          python -m playwright install --with-deps chromium

      - name: Restore the bounded WAVE-06 source packet
        shell: bash
        run: |
          cat .agent/administration-wave06-payload.part-* | base64 --decode | tar -xz

      - name: Capture the remaining Administration references
        run: |
          python docs/00-research/ux-service-reference/capture_administration_remaining_wave06.py --all-packet-targets
          python docs/00-research/ux-service-reference/finalize_administration_remaining_wave06.py

      - name: Validate reference evidence and documentation
        env:
          PYTHONPATH: backend/src
        run: |
          node --check docs/00-research/ux-service-reference/administration-remaining.js
          python -m py_compile \
            docs/00-research/ux-service-reference/capture_administration_remaining_wave06.py \
            docs/00-research/ux-service-reference/validate_administration_remaining_wave06.py \
            docs/00-research/ux-service-reference/finalize_administration_remaining_wave06.py
          ruff check \
            docs/00-research/ux-service-reference/capture_administration_remaining_wave06.py \
            docs/00-research/ux-service-reference/validate_administration_remaining_wave06.py \
            docs/00-research/ux-service-reference/finalize_administration_remaining_wave06.py
          python docs/00-research/ux-service-reference/validate_administration_remaining_wave06.py \
            --all-packet-targets --expect-main-agent-status accepted
          python docs/00-research/ux-service-reference/validate_service_reference_inventory.py
          python -m cmp.tools.user_guide --root .
          pytest -q tests/contracts/test_user_guide.py
          python -m cmp.tools.documentation_impact --root . --mode worktree
          git diff --check

      - name: Commit generated reference evidence
        shell: bash
        run: |
          git rm .agent/administration-wave06-ready
          git rm .agent/administration-wave06-payload.part-*
          git rm .github/workflows/agent-administration-wave06.yml
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add -A
          git commit -m 'docs(#167): complete Administration reference candidates'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
