name: Agent source export

# Temporary review helper. Remove before the draft PR is considered complete.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        shell: bash
        run: tar --exclude=.git -czf /tmp/cae-material-platform-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: agent-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/cae-material-platform-source.tar.gz
          retention-days: 1
          if-no-files-found: error
