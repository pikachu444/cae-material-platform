name: Cross-platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy

jobs:
  linux-ci:
    name: Linux CI with container service
    runs-on: ubuntu-24.04
    steps:
      - name: Use LF checkout defaults
        run: git config --global core.autocrlf false
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.5
          python-version: 3.12.14
          enable-cache: true
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact npm
        run: npm install --global npm@11.17.0
      - name: Validate canonical Compose configuration
        run: docker compose -f deploy/compose/docker-compose.demo.yml config --quiet
      - name: Start isolated PostgreSQL service
        run: >-
          docker compose -f deploy/compose/docker-compose.demo.yml
          --profile test up --detach --wait postgres-test
      - name: Run repository task CLI
        env:
          CMP_TEST_POSTGRES_DSN: postgresql+psycopg://cmp_test_owner@127.0.0.1:54330/postgres
        run: uv run python scripts/repository_tasks.py ci --require-container-tests
      - name: Capture PostgreSQL service logs
        if: always()
        run: >-
          docker compose -f deploy/compose/docker-compose.demo.yml
          --profile test logs --no-color postgres-test
      - name: Stop isolated PostgreSQL service
        if: always()
        run: >-
          docker compose -f deploy/compose/docker-compose.demo.yml
          --profile test down

  windows-host-ci:
    name: Windows host-only CI
    runs-on: windows-2025
    steps:
      - name: Use CRLF checkout defaults
        shell: pwsh
        run: git config --global core.autocrlf true
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.5
          python-version: 3.12.14
          enable-cache: true
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact npm
        shell: pwsh
        run: npm install --global npm@11.17.0
      - name: Run repository task CLI without containers
        shell: pwsh
        run: uv run python scripts/repository_tasks.py ci --host-only
