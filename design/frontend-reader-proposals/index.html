<script>
(()=>{
const root=document.getElementById('cae-independent'), mount=root.querySelector('.mount');
const state={design:'a',task:'tests',selected:null,view:'list',q:'',temp:'',page:0,plotMax:.1,specimen:'',rate:'',treeOpen:true,treeScroll:0};
let listPosition={x:0,y:0,scrollers:[]}, relatedReturn=null, previewScrollOrigin=null, lastRowClick=null;
const labels={a:'탐색 트리 · 분류 필터 · 우측 기술 시트',b:'검색 조건 콘솔 · 결과 · 별도 상세 문서',c:'관심 목록 · 독립 분석 창',d:'조건 스크리너 → 차트 터미널',e:'자료 색인 → 기술 문서',f:'조건 매트릭스 → 분석 노트'};
const temps=[23,-20,80,5,23,40,60,100,0,150,200,23];
const records=Array.from({length:48},(_,i)=>({id:i+1,name:i===0?'인장 시험 042':i===7?'장기 보관 시편의 반복 인장 시험 105':`반복 인장 시험 ${String(i+1).padStart(3,'0')}`,material:'Reference steel',specimen:i===0?'STL-042':`STL-${String(i+1).padStart(3,'0')}`,temp:temps[i%12],rate:[.001,.0005,.002,.001,.0008,.001][i%6]}));
const cards=Array.from({length:8},(_,i)=>({id:i+1,name:`선형 탄성 카드 ${String(i+1).padStart(3,'0')}`,material:'Reference steel',specimen:'ELAST',temp:null,rate:null}));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isCard=()=>state.task==='cards', title=()=>isCard()?'물성카드':'실험 데이터', collection=()=>isCard()?cards:records;
const filtered=()=>collection().filter(r=>(!state.q||[r.name,r.material,r.specimen].join(' ').toLowerCase().includes(state.q.toLowerCase()))&&(!state.temp||isCard()||r.temp===Number(state.temp))&&(state.design!=='a'||isCard()||((!state.specimen||r.specimen===state.specimen)&&(!state.rate||r.rate===Number(state.rate)))));
const selectedRecord=()=>collection().find(r=>r.id===state.selected);
const chosen=()=>state.view==='detail'?selectedRecord():null;
const nav=()=>`<nav class="tasknav" aria-label="주요 업무"><button data-task="tests" class="${!isCard()?'active':''}">실험 데이터</button><button data-task="cards" class="${isCard()?'active':''}">물성카드</button><small>작업</small><span class="planned">소재 관리</span><span class="planned">데이터 등록</span><span class="planned">데이터 처리</span><span class="planned">모델링</span></nav>`;
const search=()=>`<div class="searchbox"><input data-query aria-label="이름, 소재 또는 시편 검색" placeholder="이름, 소재, 시편 검색" value="${esc(state.q)}"><button data-search>검색</button></div>`;
function browseTree(){const specimens=[...new Set(records.map(r=>r.specimen))];return `<nav class="g-tree" aria-label="소재와 시편 탐색 트리"><button data-browse="" aria-pressed="${!state.specimen}">전체 ${title()} <small>${collection().length}</small></button><details data-material-tree ${state.treeOpen?'open':''}><summary>Reference steel</summary><ul>${isCard()?'<li><span>저장된 물성카드 · 8건</span></li>':specimens.map(s=>`<li><button data-browse="${s}" aria-pressed="${state.specimen===s}"><span>${s}</span><small>${records.filter(r=>r.specimen===s).length}</small></button></li>`).join('')}</ul></details></nav>`;}
const temperature=()=>isCard()?'<input aria-label="카드 적용 온도" value="미기재" readonly>':`<select data-temp aria-label="시험 온도"><option value="">온도 전체</option>${[...new Set(temps)].sort((a,b)=>a-b).map(x=>`<option value="${x}" ${String(x)===state.temp?'selected':''}>${x} °C</option>`).join('')}</select>`;
const properties=()=>`<div class="scroll"><table class="properties"><thead><tr><th>물성</th><th class="n">값</th><th>단위</th></tr></thead><tbody><tr><td>밀도</td><td class="n">7850</td><td>kg/m³</td></tr><tr><td>탄성계수 E</td><td class="n">210</td><td>GPa</td></tr><tr><td>푸아송비 ν</td><td class="n">0.30</td><td>무차원</td></tr></tbody></table></div>`;
const facts=r=>`<dl class="facts"><dt>소재</dt><dd>${r.material}</dd>${isCard()?'<dt>솔버</dt><dd>OpenRadioss</dd><dt>모델</dt><dd>ELAST</dd><dt>단위계</dt><dd>kg-m-s</dd><dt>적용 조건</dt><dd>미기재</dd>':`<dt>시편</dt><dd>${r.specimen}</dd><dt>시험 종류</dt><dd>인장</dd><dt>온도</dt><dd>${r.temp} °C</dd><dt>변형률 속도</dt><dd>${r.rate} s⁻¹</dd><dt>데이터 ID</dt><dd>${r.id===1?'td-00042':'td-demo-'+r.id}</dd>`}</dl>`;
const plot=()=>`<div class="plot-title"><strong>공학 응력–변형률</strong><small>합성 참조 · 원본 1,000점 · 결측 1점</small></div><div class="plot-tools"><span><i class="line-key"></i>평균 곡선</span><span><i class="band-key"></i>SD ±1 MPa · n=18</span><button data-zoom=".05">0–0.05%</button><button data-zoom=".1">전체 범위</button><output>커서로 좌표 확인</output></div><div class="plot" role="img" aria-label="합성 공학 응력 변형률 곡선. 0.1 퍼센트에서 210 MPa. 결측 구간은 연결하지 않음. 합성 표준편차 1 MPa, 18회 반복 예시."></div>`;
const artifact=r=>r.id===1?`<details><summary>저장된 카드 파일 · .rad</summary><pre class="native"></pre></details><button class="primary" data-download style="margin-top:18px">예시 카드 다운로드</button><p class="download-state" aria-live="polite"></p>`:'<p class="quiet" style="margin-top:20px">파일 미등록</p><button disabled>다운로드할 파일 없음</button>';
const relation=r=>r.id===1?`<button data-related style="margin-top:18px">${isCard()?'관련 인장 시험 042':'관련 선형 탄성 카드 001'} ↗</button>`:'';
const contents=r=>isCard()?`<h3>저장 파라미터</h3>${properties()}${facts(r)}${artifact(r)}${relation(r)}`:`${plot()}${facts(r)}${relation(r)}`;
const table=()=>{const list=filtered(),page=list.slice(state.page*12,state.page*12+12);return `<div class="scroll"><table><thead><tr>${(isCard()?['카드 이름','소재','솔버','모델','단위계','파일']:['데이터 이름','소재','시편','시험','온도 [°C]','속도 [s⁻¹]']).map((x,i)=>`<th class="${!isCard()&&i>3?'n':''}">${x}</th>`).join('')}</tr></thead><tbody>${page.map(r=>`<tr class="${r.id===state.selected?'selected':''}"><td><button data-open="${r.id}">${r.name}</button></td><td>${r.material}</td>${isCard()?`<td>OpenRadioss</td><td>ELAST</td><td>kg-m-s</td><td>${r.id===1?'.rad':'파일 미등록'}</td>`:`<td>${r.specimen}</td><td>인장</td><td class="n">${r.temp}</td><td class="n">${r.rate}</td>`}</tr>`).join('')}</tbody></table></div>${!page.length?'<div class="empty">검색 결과가 없습니다. <button data-reset>조건 지우기</button></div>':''}<div class="counts"><span>${list.length?state.page*12+1:0}–${Math.min((state.page+1)*12,list.length)} / ${list.length}건</span><div class="row"><button data-page="-1" ${state.page===0?'disabled':''}>이전</button><span>${state.page+1} / ${Math.max(1,Math.ceil(list.length/12))}</span><button data-page="1" ${(state.page+1)*12>=list.length?'disabled':''}>다음</button></div></div>`};
const close=()=>'<button data-close>← 목록으로</button>'+(relatedReturn?'<button data-return-related>이전 자료로</button>':'');
function a(){const r=chosen();return `<section class="granta"><header><b>CMP</b><span>Explore</span><span>›</span><strong>${title()}</strong><small class="end" style="color:#cdd3dc">Reference database</small></header><div class="g-grid"><aside class="g-tools">${nav()}</aside><aside class="g-facets"><details open><summary>소재·시편 탐색</summary>${browseTree()}</details><details open><summary>검색·필터</summary><label>자료 이름<input data-query placeholder="자료 검색" aria-label="자료 검색" value="${esc(state.q)}"></label>${!isCard()?`<label>시험 온도${temperature()}</label><label>변형률 속도 [s⁻¹]<select data-rate aria-label="변형률 속도"><option value="">속도 전체</option>${[.0005,.0008,.001,.002].map(x=>`<option value="${x}" ${state.rate===String(x)?'selected':''}>${x}</option>`).join('')}</select></label><p class="quiet">시험 종류 · 인장</p>`:'<p class="quiet">솔버 · OpenRadioss<br>모델 · ELAST</p>'}<div class="row"><button data-search class="primary">적용</button><button data-reset>초기화</button></div></details></aside><main class="g-result"><div class="bar"><strong>${title()} 목록</strong><small class="end">${filtered().length} records</small></div>${table()}${r?`<aside class="g-sheet">${close()}<h2 style="margin-top:20px">${r.name}</h2><small>${r.material}</small><h3>${isCard()?'Solver card':'Test information'}</h3>${contents(r)}</aside>`:''}</main></div></section>`}
function b(){const r=chosen();return `<section class="materia"><aside class="m-nav"><div class="m-brand">CMP<span style="font-weight:400;font-size:12px;display:block">Material Console</span></div>${nav()}</aside><main class="m-main"><div class="m-tabs"><strong>${title()}</strong><span>소재 데이터베이스</span><span>Engineering data</span></div><div class="m-content">${r?`<article class="m-document">${close()}<h1 style="margin-top:25px">${r.name}</h1><small>${r.material} / ${isCard()?'OpenRadioss · ELAST':r.specimen}</small><div class="m-columns"><section>${isCard()?properties()+artifact(r):plot()}</section><aside><h3>${isCard()?'카드 적용 범위':'시험 정보'}</h3>${facts(r)}${relation(r)}</aside></div></article>`:`<h1>${title()} 검색</h1><details class="m-form" open><summary>SEARCH CRITERIA · 검색 조건</summary><div class="m-fields"><label>자료 이름 / 소재 / 시편<input data-query value="${esc(state.q)}" placeholder="예: 인장 시험 042"></label><label>시험 온도${temperature()}</label><label>데이터 종류<input value="${title()}" readonly aria-label="현재 데이터 종류"></label></div><div class="m-actions"><button data-search class="primary">SEARCH</button> <button data-reset>초기화</button></div></details><div class="bar" style="padding:0 0 13px"><h3>SEARCH RESULTS</h3><small class="end">${filtered().length}건</small></div>${table()}`}</div></main></section>`}
function c(){const r=chosen();return `<section class="koyfin"><aside class="k-nav"><b>cmp<span style="color:#69a8d6">.</span></b>${nav()}</aside><main class="k-work"><header class="k-top"><strong>MY WORKSPACE</strong><span>/</span><span>${title()}</span><span class="end">Reference dataset</span></header><div class="k-panels ${r?'reading':''}"><section class="k-window"><div class="k-title"><span>${isCard()?'SOLVER CARD LIST':'TEST DATA WATCHLIST'}</span><span>${filtered().length}</span></div>${search()}${table()}</section>${r?`<section class="k-window"><div class="k-title"><span>${r.name}</span>${close()}</div><div class="detail-inner"><h2>${r.material}</h2>${isCard()?properties()+facts(r)+artifact(r):plot()+facts(r)}${relation(r)}</div></section>`:''}</div><footer class="k-footer">단위와 시험 조건은 각 데이터 기준으로 표시됩니다.</footer></main></section>`}

function matrix(){const rs=filtered().slice(state.page*6,state.page*6+6),rows=isCard()?[['소재',r=>r.material],['솔버',()=> 'OpenRadioss'],['모델',()=> 'ELAST'],['밀도 [kg/m³]',()=>7850],['탄성계수 [GPa]',()=>210],['푸아송비 [–]',()=>'.30'],['적용 조건',()=> '미기재'],['파일',r=>r.id===1?'.rad':'미등록']]:[['소재',r=>r.material],['시편',r=>r.specimen],['시험 종류',()=> '인장'],['온도 [°C]',r=>r.temp],['변형률 속도 [s⁻¹]',r=>r.rate]];return `<div class="f-matrix"><table><thead><tr><th>${isCard()?'카드 파라미터':'시험 조건'}</th>${rs.map(r=>`<th><button data-open="${r.id}">${r.name}</button></th>`).join('')}</tr></thead><tbody>${rows.map(([label,value])=>`<tr><th>${label}</th>${rs.map(r=>`<td>${value(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${!rs.length?'<div class="empty">검색 결과가 없습니다. <button data-reset>조건 지우기</button></div>':''}<div class="counts"><span>${rs.length} / ${filtered().length}건</span><div class="row"><button data-mpage="-1" ${state.page===0?'disabled':''}>이전 6건</button><button data-mpage="1" ${(state.page+1)*6>=filtered().length?'disabled':''}>다음 6건</button></div></div>`}
function f(){const r=chosen();return `<section class="lab"><header class="f-head"><strong>CMP / LAB</strong><span>Engineering notebook</span><small class="end" style="color:#b5c7d1">Reference data</small></header><div class="f-shell"><aside class="f-nav">${nav()}</aside><main class="f-main"><header><div><small>${isCard()?'PARAMETER MATRIX':'CONDITION MATRIX'}</small><h1 style="margin-top:5px">${isCard()?'카드 물성 비교':'시험 조건 비교'}</h1></div>${r?close():search()}</header>${r?`<article class="f-note"><header><h2>${r.name}</h2><small>${r.material}</small></header><div class="f-notebook"><section>${isCard()?properties()+artifact(r):plot()}</section><section><h3>${isCard()?'카드 정보':'시험 조건'}</h3>${facts(r)}${relation(r)}</section></div><div class="f-tab">${isCard()?'Stored parameters / Original file':'Engineering stress–strain / Original test data'}</div></article>`:matrix()}</main></div></section>`}
let nativeBytes=null;
function drawPlots(){
 root.querySelectorAll('.plot').forEach(el=>{
  const w=Math.max(220,el.clientWidth),h=el.clientHeight,l=64,t=22,r=24,b=50;
  const xmax=state.plotMax||.1,ymax=xmax*2100+12,x=v=>l+v/xmax*(w-l-r),y=v=>t+(1-v/ymax)*(h-t-b);
  const color={a:'#426e97',b:'#ca702c',c:'#28749b',d:'#2962dc',e:'#34677b',f:'#276775'}[state.design];mount.style.setProperty('--plot-color',color);
  const pts=Array.from({length:1000},(_,i)=>({i,x:i/999*.1,y:i/999*210})).filter(p=>p.x<=xmax);
  const segments=[pts.filter(p=>p.i<421),pts.filter(p=>p.i>421)].filter(p=>p.length);
  let s=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><rect x="${l}" y="${t}" width="${w-l-r}" height="${h-t-b}" fill="#fbfcfd" stroke="#bcc8d2"/>`;
  const ticks=w<430?2:5,step=ymax>150?50:25;
  s+='<g font-family="Inter,IBM Plex Sans KR,Segoe UI,sans-serif" font-size="12" fill="#536576">';
  for(let i=0;i<=ticks;i++){const v=xmax*i/ticks;s+=`<path d="M${x(v)} ${t}V${h-b}" stroke="#e2e8ee" stroke-dasharray="3 4"/><text x="${x(v)}" y="${h-28}" text-anchor="${i===0?'start':i===ticks?'end':'middle'}">${v.toFixed(2)}</text>`;}
  for(let v=0;v<ymax;v+=step)s+=`<path d="M${l} ${y(v)}H${w-r}" stroke="#dce4eb"/><text x="${l-10}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  s+=`<text x="${l+(w-l-r)/2}" y="${h-6}" text-anchor="middle" fill="#243b50">공학 변형률 ε [%]</text><text transform="translate(17 ${t+(h-t-b)/2}) rotate(-90)" text-anchor="middle" fill="#243b50">공학 응력 σ [MPa]</text></g>`;
  for(const segment of segments){
   const upper=segment.map(p=>`${x(p.x)},${y(p.y+1)}`).join(' '),lower=[...segment].reverse().map(p=>`${x(p.x)},${y(Math.max(0,p.y-1))}`).join(' ');
   s+=`<polygon points="${upper} ${lower}" fill="${color}" opacity=".14"/><polyline points="${segment.map(p=>`${x(p.x)},${y(p.y)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>`;
  }
  s+=`<g data-cursor visibility="hidden"><path data-cross stroke="#7c8e9e" stroke-width="1" stroke-dasharray="3 4"/><circle data-point r="4" stroke="${color}" stroke-width="2" fill="white"/></g></svg>`;el.innerHTML=s;
  const readout=el.previousElementSibling.querySelector('output');
  const group=el.querySelector('[data-cursor]'),cross=el.querySelector('[data-cross]'),point=el.querySelector('[data-point]');
  el.onpointermove=e=>{const rect=el.getBoundingClientRect(),px=e.clientX-rect.left;if(px<l||px>w-r){group.setAttribute('visibility','hidden');return}const xv=(px-l)/(w-l-r)*xmax,yv=xv*2100;const missing=Math.round(xv/.1*999)===421;readout.textContent=missing?'결측 구간':`ε ${xv.toFixed(4)} %   σ ${yv.toFixed(2)} MPa`;group.setAttribute('visibility',missing?'hidden':'visible');cross.setAttribute('d',`M${px} ${t}V${h-b}M${l} ${y(yv)}H${w-r}`);point.setAttribute('cx',px);point.setAttribute('cy',y(yv));};
  el.onpointerleave=()=>{group.setAttribute('visibility','hidden');readout.textContent='커서로 좌표 확인';};
 });
}
const preview=r=>`<header><div><small>미리보기</small><h2>${r.name}</h2></div><div class="row"><button class="primary" data-expand>상세 열기</button><button data-collapse aria-label="미리보기 접기">접기 ▾</button></div></header><div class="preview-body"><section>${isCard()?properties():plot()}</section><section>${facts(r)}<p class="preview-status">${isCard()?(r.id===1?'저장 파일 · .rad':'파일 미등록'):'합성 시험 데이터'}</p>${isCard()?artifact(r):''}</section></div>`;
const previewParent=()=>mount.querySelector({a:'.g-result',b:'.m-content',c:'.k-panels',d:'.d-main',e:'.e-index',f:'.f-main'}[state.design]);
function rememberList(){listPosition={x:window.scrollX,y:window.scrollY,scrollers:[...mount.querySelectorAll('.result-scroll,.f-matrix')].map(el=>({x:el.scrollLeft,y:el.scrollTop})),formOpen:mount.querySelector('.m-form')?.open};}
function restoreList(){requestAnimationFrame(()=>{const form=mount.querySelector('.m-form');if(form&&listPosition.formOpen!==undefined)form.open=listPosition.formOpen;mount.querySelectorAll('.result-scroll,.f-matrix').forEach((el,i)=>{el.scrollLeft=listPosition.scrollers[i]?.x||0;el.scrollTop=listPosition.scrollers[i]?.y||0});mount.querySelector(`[data-open="${state.selected}"]`)?.focus({preventScroll:true});window.scrollTo(listPosition.x,listPosition.y);});}
function updatePreview(){
 mount.dataset.mode=state.view;
 mount.querySelectorAll('[data-open]').forEach(el=>{const on=Number(el.dataset.open)===state.selected;el.setAttribute('aria-pressed',String(on));el.closest('tr[data-record]')?.classList.toggle('selected',on)});
 mount.querySelectorAll('[data-column]').forEach(el=>el.classList.toggle('column-selected',Number(el.dataset.column)===state.selected));
 mount.querySelector('.reader-preview')?.remove();mount.querySelector('.preview-reopen')?.remove();
 mount.querySelector('.g-preview-empty')?.remove();
 const r=selectedRecord();if(!r||state.view==='detail'){if(!r&&state.design==='a'&&state.view!=='detail'){const empty=document.createElement('aside');empty.className='g-preview-empty';empty.innerHTML='<h2>미리보기</h2><p>목록에서 자료를 선택하세요.</p>';previewParent().append(empty);}return;}
 const panel=document.createElement('aside');panel.className=state.view==='preview'?'reader-preview':'preview-reopen';panel.setAttribute('aria-label',state.view==='preview'?'선택 자료 미리보기':'선택 자료');
 panel.innerHTML=state.view==='preview'?preview(r):`<span>${r.name} 선택됨</span><div class="row"><button data-reopen>미리보기 ▴</button><button data-expand>상세 열기</button></div>`;previewParent().append(panel);
 if(state.view==='preview'){const header=panel.querySelector('header'),box=header.getBoundingClientRect();if(box.top<0||box.bottom>window.innerHeight)header.scrollIntoView({block:'nearest',behavior:'instant'});}
 if(nativeBytes)panel.querySelectorAll('.native').forEach(el=>el.textContent=new TextDecoder().decode(nativeBytes));requestAnimationFrame(drawPlots);
}
function selectRecord(id){if(!collection().some(r=>r.id===id))return;previewScrollOrigin={x:window.scrollX,y:window.scrollY};state.selected=id;state.view='preview';updatePreview();}
function openDetail(id=state.selected){if(!id)return;const origin=state.view==='preview'&&id===state.selected?previewScrollOrigin:null;rememberList();if(origin)Object.assign(listPosition,origin);state.selected=id;state.view='detail';state.plotMax=.1;render();root.querySelector('[data-close]')?.focus({preventScroll:true});window.scrollTo(0,root.offsetTop);}

root.addEventListener('click',e=>{
 // Minimal preview scrolling may move the original row under the pointer between clicks.
 // Preserve the native second click's record identity instead of activating the new hit target.
 if(e.detail===2&&lastRowClick&&state.view==='preview'&&e.timeStamp-lastRowClick.time<1000&&Math.abs(e.clientX-lastRowClick.x)<5&&Math.abs(e.clientY-lastRowClick.y)<5){e.preventDefault();openDetail(lastRowClick.id);lastRowClick=null;return;}
