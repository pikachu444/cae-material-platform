asyncapi: 3.0.0
info:
  title: CAE Material Platform Events
  version: 0.3.0
  description: >-
    Transport-neutral CloudEvents 1.0 contracts delivered at least once from the PostgreSQL
    transactional outbox. Consumers must use the tenant-scoped inbox event ID for deduplication.
defaultContentType: application/json
channels:
  artifactAvailable:
    address: io.cmp.artifact.available.v1
    messages:
      artifactAvailable:
        $ref: '#/components/messages/ArtifactAvailable'
  catalogSchemaDefinitionBundleApplied:
    address: io.cmp.catalog.schema-definition-bundle.applied.v1
    messages:
      catalogSchemaDefinitionBundleApplied:
        $ref: '#/components/messages/CatalogSchemaDefinitionBundleApplied'
operations:
  publishArtifactAvailable:
    action: send
    channel:
      $ref: '#/channels/artifactAvailable'
    messages:
      - $ref: '#/channels/artifactAvailable/messages/artifactAvailable'
  publishCatalogSchemaDefinitionBundleApplied:
    action: send
    channel:
      $ref: '#/channels/catalogSchemaDefinitionBundleApplied'
    messages:
      - $ref: >-
          #/channels/catalogSchemaDefinitionBundleApplied/messages/catalogSchemaDefinitionBundleApplied
components:
  messages:
    ArtifactAvailable:
      name: ArtifactAvailable
      title: Immutable Artifact became available
      contentType: application/json
      payload:
        $ref: './artifact-available.schema.json'
    CatalogSchemaDefinitionBundleApplied:
      name: CatalogSchemaDefinitionBundleApplied
      title: Approved Schema Definition Bundle application committed
      contentType: application/json
      payload:
        $ref: './catalog-schema-definition-bundle-applied.v1.schema.json'
  schemas: {}

