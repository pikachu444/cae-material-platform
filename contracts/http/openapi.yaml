openapi: 3.1.0
info:
  title: CAE Material Platform API
  summary: Revision-kernel API foundation with no material-domain resources.
  version: 0.2.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report API process health.
      responses:
        "200":
          description: The API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  headers:
    RevisionETag:
      description: Strong ETag for one concrete immutable revision.
      required: true
      schema:
        type: string
        pattern: '^"revision:[1-9][0-9]*:sha256:[0-9a-f]{64}"$'
  parameters:
    IfMatchRevision:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the expected current revision.
      schema:
        type: string
        pattern: '^"revision:[1-9][0-9]*:sha256:[0-9a-f]{64}"$'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: cmp-api
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    RevisionMetadata:
      $ref: ../revisions/revision-metadata.schema.json

