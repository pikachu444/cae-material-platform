openapi: 3.1.0
info:
  title: CAE Material Platform API
  summary: Material data management, immutable traceability, and CAE workflow platform.
  version: 0.15.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report API process health.
      responses:
        "200":
          description: The API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Return the authenticated principal and selected tenant context.
      security:
        - BearerAuth: []
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema: {type: string, format: uuid}
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
            pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      responses:
        "200":
          description: Authenticated principal and request security context.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          description: Request or trace identifier is malformed.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
        "401":
          description: Bearer access token is missing or invalid.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
            WWW-Authenticate:
              schema: {type: string}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
        "403":
          description: Principal is inactive or not provisioned.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
        "503":
          description: OIDC authentication is not configured or temporarily unavailable.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
  /api/v1/jobs:
    post:
      operationId: submitJob
      tags: [jobs]
      summary: Submit one immutable Job Spec for durable execution.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[\x21-\x7e]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubmitJobRequest"}
      responses:
        "202":
          description: Job accepted or an identical idempotent submission replayed.
          headers:
            Location:
              required: true
              schema: {type: string}
            Idempotent-Replay:
              required: true
              schema: {type: string, enum: ["true", "false"]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobResponse"}
        "401": {description: Authentication required}
        "403": {description: Job submission is not authorized}
        "409":
          description: Idempotency key or stable Job identity conflict.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "422":
          description: Job Spec or resource policy violates its contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "503":
          description: Durable job service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
  /api/v1/jobs/{job_id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Return job, attempt, progress, and terminal result references.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Tenant-scoped durable Job resource.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobResponse"}
        "401": {description: Authentication required}
        "403": {description: Job read is not authorized}
        "404":
          description: No visible Job matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "422":
          description: Job identifier violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "503":
          description: Durable job service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
  /api/v1/jobs/{job_id}:cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Request cooperative cancellation without deleting execution facts.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlJobRequest"}
      responses:
        "202":
          description: Cancellation requested or queued work cancelled atomically.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobResponse"}
        "401": {description: Authentication required}
        "403": {description: Job control is not authorized}
        "404":
          description: No visible Job matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "409":
          description: Job is already terminal with a non-cancel outcome.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "422":
          description: Cancellation request violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "503":
          description: Durable job service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
  /api/v1/jobs/{job_id}:retry:
    post:
      operationId: retryJob
      tags: [jobs]
      summary: Append a new attempt for a retryable terminal job.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlJobRequest"}
      responses:
        "202":
          description: A distinct immutable Attempt and Job Spec were appended.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobResponse"}
        "401": {description: Authentication required}
        "403": {description: Job control is not authorized}
        "404":
          description: No visible Job matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "409":
          description: State, immutable input, deadline, or attempt cap forbids retry.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "422":
          description: Retry request violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "503":
          description: Durable job service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
  /api/v1/plugins/packages:
    post:
      operationId: registerPluginPackage
      tags: [plugins]
      summary: Register one immutable manifest, package digest, and schema bundle.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[\x21-\x7e]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterPluginPackageRequest"}
      responses:
        "201":
          description: Immutable package registered or an identical submission replayed.
          headers:
            Location:
              required: true
              schema: {type: string}
            Idempotent-Replay:
              required: true
              schema: {type: string, enum: ["true", "false"]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin package submission is not authorized}
        "409":
          description: Plugin/version, digest, or idempotency identity conflict.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Manifest, artifact reference, or schema violates its contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/plugins/packages/{package_id}:
    get:
      operationId: getPluginPackage
      tags: [plugins]
      summary: Read an immutable package and its append-only state history.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginPackageId"
      responses:
        "200":
          description: Tenant-scoped immutable plugin package resource.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin package read is not authorized}
        "404":
          description: No visible package matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Package identifier violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/plugins/packages/{package_id}:verify:
    post:
      operationId: verifyPluginPackage
      tags: [plugins]
      summary: Record operator verification of signature, SBOM, and policy evidence.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginPackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlPluginPackageRequest"}
      responses:
        "200":
          description: Package became activation-eligible or was already eligible.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin verification is not authorized}
        "404":
          description: No visible package matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "409":
          description: Package state cannot accept verification.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Verification reason violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/plugins/packages/{package_id}:activate:
    post:
      operationId: activatePluginPackage
      tags: [plugins]
      summary: Append the project allowlist activation for an eligible package.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginPackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlPluginPackageRequest"}
      responses:
        "200":
          description: Project-scoped package activation appended or replayed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin activation is not authorized}
        "404":
          description: No visible package matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "409":
          description: Package is not eligible, is revoked, or already terminal.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Activation reason violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/plugins/packages/{package_id}:revoke:
    post:
      operationId: revokePluginPackage
      tags: [plugins]
      summary: Append revocation without deleting historical package identity.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginPackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlPluginPackageRequest"}
      responses:
        "200":
          description: Package revocation appended or replayed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin revocation is not authorized}
        "404":
          description: No visible package matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "409":
          description: Package state cannot accept revocation.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Revocation reason violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/uploads:
    post:
      operationId: createUploadSession
      tags: [artifacts]
      summary: Create a resumable digest-pinned multipart upload session.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateUploadRequest"}
      responses:
        "201":
          description: Upload session created or replayed.
          headers:
            Location: {required: true, schema: {type: string}}
            Idempotent-Replay: {required: true, schema: {type: string, enum: ["true", "false"]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreateUploadResponse"}
        "409": {description: Idempotency or upload conflict.}
        "422": {description: Invalid upload manifest.}
        "503": {description: Upload service unavailable.}
  /api/v1/uploads/{upload_id}:
    get:
      operationId: getUploadSession
      tags: [artifacts]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Tenant-visible upload session and immutable part manifest.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSessionResponse"}
        "404": {description: Upload session not visible.}
  /api/v1/uploads/{upload_id}/parts/{part_number}:
    put:
      operationId: uploadPart
      tags: [artifacts]
      summary: Stream one immutable upload part.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: part_number
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 100000}
        - name: Upload-Capability
          in: header
          required: true
          schema: {type: string, minLength: 32, maxLength: 4096}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Part stored and recorded immutably.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSessionResponse"}
        "403": {description: Capability scope mismatch.}
        "404": {description: Upload session not visible.}
        "409": {description: Part or upload state conflict.}
        "410": {description: Capability expired.}
        "422": {description: Part violates the immutable upload manifest.}
        "503": {description: Object store unavailable.}
  /api/v1/uploads/{upload_id}:complete:
    post:
      operationId: completeUpload
      tags: [artifacts]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: Upload-Capability
          in: header
          required: true
          schema: {type: string, minLength: 32, maxLength: 4096}
      responses:
        "200":
          description: Staged object verified and immutable Raw Asset committed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CompleteUploadResponse"}
        "403": {description: Capability scope mismatch.}
        "404": {description: Upload session not visible.}
        "409": {description: Upload state conflict.}
        "410": {description: Capability expired.}
        "422": {description: Missing part or digest/size mismatch.}
        "503": {description: Object store unavailable.}
  /api/v1/uploads/{upload_id}:cancel:
    post:
      operationId: cancelUpload
      tags: [artifacts]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: Upload-Capability
          in: header
          required: true
          schema: {type: string, minLength: 32, maxLength: 4096}
      responses:
        "200":
          description: Upload cancelled without deleting an existing Raw Asset.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSessionResponse"}
        "403": {description: Capability scope mismatch.}
        "404": {description: Upload session not visible.}
        "409": {description: Terminal upload cannot be cancelled.}
  /api/v1/raw-assets/{raw_asset_id}:
    get:
      operationId: getRawAsset
      tags: [artifacts]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RawAssetId"
      responses:
        "200":
          description: Immutable Raw Asset metadata without internal storage keys.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RawAssetResponse"}
        "404": {description: Raw Asset not visible.}
  /api/v1/artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      summary: Read an immutable content-addressed Artifact manifest.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Tenant-visible Artifact metadata without an object-store key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArtifactResponse"}
        "401": {description: Authentication required.}
        "403": {description: Artifact classification is not authorized.}
        "404": {description: Artifact not visible.}
        "503": {description: Artifact service unavailable.}
  /api/v1/artifacts/{artifact_id}:download-token:
    post:
      operationId: issueArtifactDownloadToken
      tags: [artifacts]
      summary: Issue an actor- and tenant-scoped short-lived transfer capability.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Short-lived Artifact transfer grant.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArtifactDownloadGrant"}
        "401": {description: Authentication required.}
        "403": {description: Artifact access is not authorized.}
        "404": {description: Artifact not visible.}
        "409":
          description: Artifact object is missing, corrupt, or not verified.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ArtifactProblem"}
        "503": {description: Object store unavailable.}
  /api/v1/artifacts/{artifact_id}/content:
    get:
      operationId: downloadArtifactContent
      tags: [artifacts]
      summary: Stream immutable bytes without exposing the object-store key.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - name: Artifact-Transfer-Token
          in: header
          required: true
          schema: {type: string, minLength: 32, maxLength: 4096}
      responses:
        "200":
          description: Immutable Artifact bytes.
          headers:
            X-Content-SHA256:
              required: true
              schema: {type: string, pattern: '^[0-9a-f]{64}$'}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "401": {description: Authentication required.}
        "403":
          description: Transfer capability is invalid for this actor or tenant.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ArtifactProblem"}
        "404": {description: Artifact not visible.}
        "409": {description: Artifact object is missing, corrupt, or not verified.}
        "410": {description: Transfer capability expired.}
        "422": {description: Transfer header is invalid.}
        "503": {description: Object store unavailable.}
  /api/v1/provenance/entities/{entity_id}:
    get:
      operationId: getProvenanceEntity
      tags: [provenance]
      summary: Read one immutable provenance Entity and completeness status.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProvenanceEntityId"
      responses:
        "200":
          description: Tenant-visible immutable Entity metadata and completeness status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProvenanceEntityResponse"}
        "401": {description: Authentication required.}
        "403":
          description: Provenance read is not authorized.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProvenanceProblem"}
        "404":
          description: Entity not visible.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProvenanceProblem"}
        "409":
          description: Query conflicts with immutable provenance state.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProvenanceProblem"}
        "422":
          description: Entity identifier is invalid.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProvenanceProblem"}
        "503":
          description: Provenance service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProvenanceProblem"}
  /api/v1/provenance/entities/{entity_id}/lineage:
    get:
      operationId: getProvenanceLineage
      tags: [provenance]
      summary: Traverse a bounded typed upstream or downstream provenance subgraph.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProvenanceEntityId"
        - name: direction
          in: query
          required: false
          schema: {type: string, enum: [upstream, downstream], default: upstream}
        - name: max_depth
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 20, default: 10}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 4096}
        - name: target_entity_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
            pattern: '^[a-z][a-z0-9]*([._-][a-z0-9]+)+$'
      responses:
        "200":
          description: Cursor-paginated bounded typed lineage page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProvenanceLineageResponse"}
        "401": {description: Authentication required.}
        "403": {description: Provenance read is not authorized.}
        "404": {description: Root Entity not visible.}
        "409": {description: Stored graph cannot produce a valid bounded path.}
        "422":
          description: Query, filter, limit, or cursor is invalid.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/ProvenanceProblem"}
        "503": {description: Provenance service unavailable.}
  /api/v1/provenance/entities/{entity_id}/impact:
    get:
      operationId: getProvenanceImpact
      tags: [provenance]
      summary: Find bounded downstream impact from one immutable Entity.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProvenanceEntityId"
        - name: max_depth
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 20, default: 10}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 4096}
        - name: target_entity_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
            pattern: '^[a-z][a-z0-9]*([._-][a-z0-9]+)+$'
      responses:
        "200":
          description: Cursor-paginated downstream impact page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProvenanceLineageResponse"}
        "401": {description: Authentication required.}
        "403": {description: Provenance read is not authorized.}
        "404": {description: Root Entity not visible.}
        "409": {description: Stored graph cannot produce a valid bounded path.}
        "422": {description: Query, filter, limit, or cursor is invalid.}
        "503": {description: Provenance service unavailable.}
  /api/v1/provenance/entities/{entity_id}/completeness:
    get:
      operationId: getProvenanceCompleteness
      tags: [provenance]
      summary: Evaluate the bounded upstream provenance completeness gate.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProvenanceEntityId"
      responses:
        "200":
          description: Complete, incomplete, or indeterminate gate report.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProvenanceCompletenessResponse"}
        "401": {description: Authentication required.}
        "403": {description: Provenance read is not authorized.}
        "404": {description: Root Entity not visible.}
        "409": {description: Stored graph cannot produce a valid bounded report.}
        "503": {description: Provenance service unavailable.}
  /api/v1/audit/events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Query tenant-scoped append-only audit events.
      security:
        - BearerAuth: []
      parameters:
        - name: after_sequence
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - name: action
          in: query
          required: false
          schema: {type: string, minLength: 3, maxLength: 150}
        - name: actor_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: target_type
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 150}
        - name: target_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: outcome
          in: query
          required: false
          schema: {type: string, enum: [success, failure, denied]}
        - name: occurred_from
          in: query
          required: false
          schema: {type: string, format: date-time}
        - name: occurred_to
          in: query
          required: false
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Sequence-paginated tenant audit events without raw payloads.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditEventPageResponse"}
        "401": {description: Authentication required.}
        "403": {description: Audit read is not authorized.}
        "409": {description: Audit query conflicts with immutable chain state.}
        "422":
          description: Audit filters or pagination bounds are invalid.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuditProblem"}
        "503": {description: Audit service unavailable.}
  /api/v1/audit/integrity:
    get:
      operationId: getAuditIntegrity
      tags: [audit]
      summary: Verify the complete visible event chain and periodic segment roots.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Hash-chain and segment-root integrity report.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditIntegrityResponse"}
        "401": {description: Authentication required.}
        "403": {description: Audit read is not authorized.}
        "409": {description: Audit chain cannot be verified.}
        "422": {description: Audit request is invalid.}
        "503": {description: Audit service unavailable.}
  /api/v1/audit/export:
    get:
      operationId: exportAuditSegment
      tags: [audit]
      summary: Export a bounded event range with chain anchor, roots, and integrity report.
      security:
        - BearerAuth: []
      parameters:
        - name: from_sequence
          in: query
          required: true
          schema: {type: integer, minimum: 1}
        - name: to_sequence
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: At most 10000 events with segment roots and full-chain integrity status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditExportResponse"}
        "401": {description: Authentication required.}
        "403": {description: Audit export is not authorized.}
        "409": {description: Audit export conflicts with immutable chain state.}
        "422":
          description: Export range is invalid or exceeds 10000 events.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuditProblem"}
        "503": {description: Audit service unavailable.}
  /api/v1/materials:
    get:
      operationId: listMaterials
      tags: [catalog]
      summary: Search current Material revisions in the selected organization and project.
      security: [{BearerAuth: []}]
      parameters:
        - name: q
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Current Material heads visible to catalog.read.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialResponse"}
        "401": {description: Authentication required.}
        "403": {description: Catalog read is not authorized.}
        "422": {description: Search request is invalid.}
        "503": {description: Catalog service unavailable.}
    post:
      operationId: createMaterial
      tags: [catalog]
      summary: Create a stable Material identity and first immutable revision.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialCreateRequest"}
      responses:
        "201":
          description: Material identity and revision 1 created.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/json:
              schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialResponse"}
        "401": {description: Authentication required.}
        "403": {description: Catalog write is not authorized.}
        "409": {description: Typed parent or immutable state conflict.}
        "422": {description: Typed Material content is invalid.}
        "503": {description: Catalog service unavailable.}
  /api/v1/materials/{material_id}:
    get:
      operationId: getMaterial
      tags: [catalog]
      summary: Read a Material, its current States, properties, and provenance summary.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/MaterialId"}]
      responses:
        "200":
          description: Current Material detail.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterialDetailResponse"}
        "401": {description: Authentication required.}
        "403": {description: Catalog read is not authorized.}
        "404": {description: No visible Material matches the identifier.}
        "503": {description: Catalog service unavailable.}
  /api/v1/materials/{material_id}/revisions:
    get:
      operationId: listMaterialRevisions
      tags: [catalog]
      summary: List immutable revisions for one Material identity.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/MaterialId"}]
      responses:
        "200":
          description: Newest-first Material revision history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [material_id, revisions]
                properties:
                  material_id: {type: string, format: uuid}
                  revisions:
                    type: array
                    items: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialRevision"}
        "401": {description: Authentication required.}
        "403": {description: Catalog read is not authorized.}
        "404": {description: No visible Material matches the identifier.}
    post:
      operationId: reviseMaterial
      tags: [catalog]
      summary: Append an immutable Material revision using If-Match.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/MaterialId"
        - $ref: "#/components/parameters/IfMatchRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialReviseRequest"}
      responses:
        "200":
          description: A new Material revision was appended.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/json:
              schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialResponse"}
        "401": {description: Authentication required.}
        "403": {description: Catalog write is not authorized.}
        "404": {description: No visible Material matches the identifier.}
        "412":
          description: Current head differs from the supplied strong ETag.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/problem+json:
              schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/CatalogProblem"}
        "422": {description: Revision request is invalid.}
  /api/v1/materials/{material_id}/revisions:compare:
    get:
      operationId: compareMaterialRevisions
      tags: [catalog]
      summary: Compare two concrete immutable Material revisions.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/MaterialId"
        - name: left_revision_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: right_revision_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Typed field-level comparison; no moving revision aliases are accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterialRevisionComparisonResponse"}
        "401": {description: Authentication required.}
        "403": {description: Catalog read is not authorized.}
        "404": {description: One or both revisions are not visible.}
  /api/v1/materials/{material_id}/states:
    post:
      operationId: createMaterialState
      tags: [catalog]
      summary: Create a Material State bound to a concrete Material revision.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/MaterialId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialStateCreateRequest"}
      responses:
        "201":
          description: Material State revision 1 created.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/json:
              schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialStateResponse"}
        "401": {description: Authentication required.}
        "403": {description: Catalog write is not authorized.}
        "404": {description: Selected Material revision is not visible.}
        "422": {description: Typed state content is invalid.}
  /api/v1/material-states/{material_state_id}:
    get:
      operationId: getMaterialState
      tags: [catalog]
      summary: Read one current Material State revision.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/MaterialStateId"}]
      responses:
        "200":
          description: Current Material State revision.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/json:
              schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialStateResponse"}
        "401": {description: Authentication required.}
        "403": {description: Catalog read is not authorized.}
        "404": {description: No visible Material State matches the identifier.}
  /api/v1/material-states/{material_state_id}/revisions:
    post:
      operationId: reviseMaterialState
      tags: [catalog]
      summary: Append a Material State revision using If-Match.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/MaterialStateId"
        - $ref: "#/components/parameters/IfMatchRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialStateCreateRequest"}
      responses:
        "200":
          description: New Material State revision appended.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/json:
              schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialStateResponse"}
        "401": {description: Authentication required.}
        "403": {description: Catalog write is not authorized.}
        "404": {description: No visible Material State matches the identifier.}
        "412": {description: Current head differs from the supplied strong ETag.}
  /api/v1/material-states/{material_state_id}/property-sets:
    post:
      operationId: createPropertySet
      tags: [catalog]
      summary: Record explicitly typed SI mechanical properties for a Material State revision.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/MaterialStateId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/PropertySetCreateRequest"}
      responses:
        "201":
          description: Typed Property Set revision 1 created.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/json:
              schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/PropertySetResponse"}
        "401": {description: Authentication required.}
        "403": {description: Catalog write is not authorized.}
        "404": {description: Selected Material State revision is not visible.}
        "422": {description: Typed SI property content is invalid.}
  /api/v1/property-sets/{property_set_id}:
    get:
      operationId: getPropertySet
      tags: [catalog]
      summary: Read one current typed Property Set revision.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/PropertySetId"}]
      responses:
        "200":
          description: Current Property Set revision.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/json:
              schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/PropertySetResponse"}
        "401": {description: Authentication required.}
        "403": {description: Catalog read is not authorized.}
        "404": {description: No visible Property Set matches the identifier.}
  /api/v1/property-sets/{property_set_id}/revisions:
    post:
      operationId: revisePropertySet
      tags: [catalog]
      summary: Append a typed Property Set revision using If-Match.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/PropertySetId"
        - $ref: "#/components/parameters/IfMatchRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/PropertySetCreateRequest"}
      responses:
        "200":
          description: New Property Set revision appended.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/json:
              schema: {$ref: "../catalog/catalog-resources.schema.json#/$defs/PropertySetResponse"}
        "401": {description: Authentication required.}
        "403": {description: Catalog write is not authorized.}
        "404": {description: No visible Property Set matches the identifier.}
        "412": {description: Current head differs from the supplied strong ETag.}
  /api/v1/material-states/{material_state_id}/material-models:
    get:
      operationId: listMaterialModelsForState
      tags: [modeling]
      summary: List current reference Material Model IR revisions for one Material State.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/MaterialStateId"}]
      responses:
        "200":
          description: Current Material Model IR heads visible to modeling.read.
          content:
            application/json:
              schema: {$ref: "../modeling/reference-linear-elastic-resources.schema.json#/$defs/MaterialModelListResponse"}
        "401": {description: Authentication required.}
        "403": {description: Modeling read is not authorized.}
        "503": {description: Material Model service unavailable.}
    post:
      operationId: createReferenceLinearElasticMaterialModel
      tags: [modeling]
      summary: Create a non-production reference linear-elastic IR from one concrete Property Set revision.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/MaterialStateId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../modeling/reference-linear-elastic-resources.schema.json#/$defs/ReferenceModelCreateRequest"}
      responses:
        "201":
          description: Stable Material Model identity and immutable IR revision 1 created.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/json:
              schema: {$ref: "../modeling/reference-linear-elastic-resources.schema.json#/$defs/MaterialModelResponse"}
        "401": {description: Authentication required.}
        "403": {description: Modeling write is not authorized.}
        "404":
          description: The concrete source Property Set revision is not visible for this Material State.
          content:
            application/problem+json:
              schema: {$ref: "../modeling/reference-linear-elastic-resources.schema.json#/$defs/ModelingProblem"}
        "409":
          description: Immutable source or revision state conflict.
          content:
            application/problem+json:
              schema: {$ref: "../modeling/reference-linear-elastic-resources.schema.json#/$defs/ModelingProblem"}
        "422":
          description: Typed SI source values are not valid for the reference model.
          content:
            application/problem+json:
              schema: {$ref: "../modeling/reference-linear-elastic-resources.schema.json#/$defs/ModelingProblem"}
        "503": {description: Material Model service unavailable.}
  /api/v1/material-models/{material_model_id}:
    get:
      operationId: getMaterialModel
      tags: [modeling]
      summary: Read one current immutable Material Model IR revision.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/MaterialModelId"}]
      responses:
        "200":
          description: Current Material Model IR revision.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/json:
              schema: {$ref: "../modeling/reference-linear-elastic-resources.schema.json#/$defs/MaterialModelResponse"}
        "401": {description: Authentication required.}
        "403": {description: Modeling read is not authorized.}
        "404": {description: No visible Material Model matches the identifier.}
        "503": {description: Material Model service unavailable.}
  /api/v1/material-models/{material_model_id}/revisions:
    get:
      operationId: listMaterialModelRevisions
      tags: [modeling]
      summary: List immutable revisions for one Material Model IR.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/MaterialModelId"}]
      responses:
        "200":
          description: Newest-first Material Model IR revision history.
          content:
            application/json:
              schema: {$ref: "../modeling/reference-linear-elastic-resources.schema.json#/$defs/MaterialModelRevisionListResponse"}
        "401": {description: Authentication required.}
        "403": {description: Modeling read is not authorized.}
        "404": {description: No visible Material Model matches the identifier.}
        "503": {description: Material Model service unavailable.}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT access token
      description: RFC 6750 bearer access token; ID tokens are rejected.
  headers:
    RevisionETag:
      description: Strong ETag for one concrete immutable revision.
      required: true
      schema:
        type: string
        pattern: '^"revision:[1-9][0-9]*:sha256:[0-9a-f]{64}"$'
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MaterialId:
      name: material_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MaterialStateId:
      name: material_state_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PropertySetId:
      name: property_set_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MaterialModelId:
      name: material_model_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PluginPackageId:
      name: package_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RawAssetId:
      name: raw_asset_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProvenanceEntityId:
      name: entity_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IfMatchRevision:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the expected current revision.
      schema:
        type: string
        pattern: '^"revision:[1-9][0-9]*:sha256:[0-9a-f]{64}"$'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: cmp-api
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    RevisionMetadata:
      $ref: ../revisions/revision-metadata.schema.json
    MeResponse:
      $ref: ../identity/me-response.schema.json
    AuthenticationProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, trace_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        code: {type: string, pattern: '^CMP-[A-Z]+-[0-9]{4}$'}
        trace_id:
          type: string
          pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    SubmitJobRequest:
      $ref: ../jobs/job-submission.schema.json
    ControlJobRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
    JobResponse:
      $ref: ../jobs/job-resource.schema.json
    JobProblem:
      $ref: ../jobs/job-problem.schema.json
    RegisterPluginPackageRequest:
      $ref: ../plugins/plugin-package-registration.schema.json
    ControlPluginPackageRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
    PluginPackageResponse:
      $ref: ../plugins/plugin-package-resource.schema.json
    PluginProblem:
      $ref: ../plugins/plugin-problem.schema.json
    CreateUploadRequest:
      $ref: ../artifacts/upload-session-create.schema.json
    CreateUploadResponse:
      $ref: ../artifacts/upload-create-response.schema.json
    UploadSessionResponse:
      $ref: ../artifacts/upload-session-resource.schema.json
    CompleteUploadResponse:
      $ref: ../artifacts/upload-completion.schema.json
    RawAssetResponse:
      $ref: ../artifacts/raw-asset-resource.schema.json
    UploadProblem:
      $ref: ../artifacts/upload-problem.schema.json
    ArtifactResponse:
      $ref: ../artifacts/artifact-resource.schema.json
    ArtifactDownloadGrant:
      $ref: ../artifacts/artifact-download-grant.schema.json
    ArtifactProblem:
      $ref: ../artifacts/artifact-problem.schema.json
    ProvenanceEntityResponse:
      $ref: ../provenance/provenance-entity-resource.schema.json
    ProvenanceLineageResponse:
      $ref: ../provenance/provenance-lineage.schema.json
    ProvenanceCompletenessResponse:
      $ref: ../provenance/provenance-completeness.schema.json
    ProvenanceProblem:
      $ref: ../provenance/provenance-problem.schema.json
    AuditEventPageResponse:
      $ref: ../audit/audit-event-page.schema.json
    AuditIntegrityResponse:
      $ref: ../audit/audit-integrity.schema.json
    AuditExportResponse:
      $ref: ../audit/audit-export.schema.json
    AuditProblem:
      $ref: ../audit/audit-problem.schema.json
    MaterialDetailResponse:
      type: object
      additionalProperties: false
      required: [material, states, property_sets]
      properties:
        material: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialResponse"}
        states:
          type: array
          items: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialStateResponse"}
        property_sets:
          type: array
          items: {$ref: "../catalog/catalog-resources.schema.json#/$defs/PropertySetResponse"}
    MaterialRevisionComparisonResponse:
      type: object
      additionalProperties: false
      required: [material_id, left, right, changed_fields]
      properties:
        material_id: {type: string, format: uuid}
        left: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialRevision"}
        right: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialRevision"}
        changed_fields:
          type: array
          items: {type: string, minLength: 1, maxLength: 255}

