openapi: 3.1.0
info:
  title: CAE Material Platform API
  summary: Identity, authorization, and revision foundation with no material-domain resources.
  version: 0.4.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report API process health.
      responses:
        "200":
          description: The API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Return the authenticated principal and selected tenant context.
      security:
        - BearerAuth: []
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema: {type: string, format: uuid}
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
            pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      responses:
        "200":
          description: Authenticated principal and request security context.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          description: Request or trace identifier is malformed.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
        "401":
          description: Bearer access token is missing or invalid.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
            WWW-Authenticate:
              schema: {type: string}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
        "403":
          description: Principal is inactive or not provisioned.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
        "503":
          description: OIDC authentication is not configured or temporarily unavailable.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT access token
      description: RFC 6750 bearer access token; ID tokens are rejected.
  headers:
    RevisionETag:
      description: Strong ETag for one concrete immutable revision.
      required: true
      schema:
        type: string
        pattern: '^"revision:[1-9][0-9]*:sha256:[0-9a-f]{64}"$'
  parameters:
    IfMatchRevision:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the expected current revision.
      schema:
        type: string
        pattern: '^"revision:[1-9][0-9]*:sha256:[0-9a-f]{64}"$'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: cmp-api
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    RevisionMetadata:
      $ref: ../revisions/revision-metadata.schema.json
    MeResponse:
      $ref: ../identity/me-response.schema.json
    AuthenticationProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, trace_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        code: {type: string, pattern: '^CMP-[A-Z]+-[0-9]{4}$'}
        trace_id:
          type: string
          pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'

