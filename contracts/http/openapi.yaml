openapi: 3.1.0
info:
  title: CAE Material Platform API
  summary: Identity, revision, durable job, and immutable plugin foundation.
  version: 0.7.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report API process health.
      responses:
        "200":
          description: The API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Return the authenticated principal and selected tenant context.
      security:
        - BearerAuth: []
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema: {type: string, format: uuid}
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
            pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      responses:
        "200":
          description: Authenticated principal and request security context.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          description: Request or trace identifier is malformed.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
        "401":
          description: Bearer access token is missing or invalid.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
            WWW-Authenticate:
              schema: {type: string}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
        "403":
          description: Principal is inactive or not provisioned.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
        "503":
          description: OIDC authentication is not configured or temporarily unavailable.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
  /api/v1/jobs:
    post:
      operationId: submitJob
      tags: [jobs]
      summary: Submit one immutable Job Spec for durable execution.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[\x21-\x7e]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubmitJobRequest"}
      responses:
        "202":
          description: Job accepted or an identical idempotent submission replayed.
          headers:
            Location:
              required: true
              schema: {type: string}
            Idempotent-Replay:
              required: true
              schema: {type: string, enum: ["true", "false"]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobResponse"}
        "401": {description: Authentication required}
        "403": {description: Job submission is not authorized}
        "409":
          description: Idempotency key or stable Job identity conflict.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "422":
          description: Job Spec or resource policy violates its contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "503":
          description: Durable job service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
  /api/v1/jobs/{job_id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Return job, attempt, progress, and terminal result references.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Tenant-scoped durable Job resource.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobResponse"}
        "401": {description: Authentication required}
        "403": {description: Job read is not authorized}
        "404":
          description: No visible Job matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "422":
          description: Job identifier violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "503":
          description: Durable job service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
  /api/v1/jobs/{job_id}:cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Request cooperative cancellation without deleting execution facts.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlJobRequest"}
      responses:
        "202":
          description: Cancellation requested or queued work cancelled atomically.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobResponse"}
        "401": {description: Authentication required}
        "403": {description: Job control is not authorized}
        "404":
          description: No visible Job matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "409":
          description: Job is already terminal with a non-cancel outcome.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "422":
          description: Cancellation request violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "503":
          description: Durable job service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
  /api/v1/jobs/{job_id}:retry:
    post:
      operationId: retryJob
      tags: [jobs]
      summary: Append a new attempt for a retryable terminal job.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlJobRequest"}
      responses:
        "202":
          description: A distinct immutable Attempt and Job Spec were appended.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobResponse"}
        "401": {description: Authentication required}
        "403": {description: Job control is not authorized}
        "404":
          description: No visible Job matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "409":
          description: State, immutable input, deadline, or attempt cap forbids retry.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "422":
          description: Retry request violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "503":
          description: Durable job service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
  /api/v1/plugins/packages:
    post:
      operationId: registerPluginPackage
      tags: [plugins]
      summary: Register one immutable manifest, package digest, and schema bundle.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[\x21-\x7e]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterPluginPackageRequest"}
      responses:
        "201":
          description: Immutable package registered or an identical submission replayed.
          headers:
            Location:
              required: true
              schema: {type: string}
            Idempotent-Replay:
              required: true
              schema: {type: string, enum: ["true", "false"]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin package submission is not authorized}
        "409":
          description: Plugin/version, digest, or idempotency identity conflict.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Manifest, artifact reference, or schema violates its contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/plugins/packages/{package_id}:
    get:
      operationId: getPluginPackage
      tags: [plugins]
      summary: Read an immutable package and its append-only state history.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginPackageId"
      responses:
        "200":
          description: Tenant-scoped immutable plugin package resource.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin package read is not authorized}
        "404":
          description: No visible package matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Package identifier violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/plugins/packages/{package_id}:verify:
    post:
      operationId: verifyPluginPackage
      tags: [plugins]
      summary: Record operator verification of signature, SBOM, and policy evidence.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginPackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlPluginPackageRequest"}
      responses:
        "200":
          description: Package became activation-eligible or was already eligible.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin verification is not authorized}
        "404":
          description: No visible package matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "409":
          description: Package state cannot accept verification.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Verification reason violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/plugins/packages/{package_id}:activate:
    post:
      operationId: activatePluginPackage
      tags: [plugins]
      summary: Append the project allowlist activation for an eligible package.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginPackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlPluginPackageRequest"}
      responses:
        "200":
          description: Project-scoped package activation appended or replayed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin activation is not authorized}
        "404":
          description: No visible package matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "409":
          description: Package is not eligible, is revoked, or already terminal.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Activation reason violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/plugins/packages/{package_id}:revoke:
    post:
      operationId: revokePluginPackage
      tags: [plugins]
      summary: Append revocation without deleting historical package identity.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginPackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlPluginPackageRequest"}
      responses:
        "200":
          description: Package revocation appended or replayed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin revocation is not authorized}
        "404":
          description: No visible package matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "409":
          description: Package state cannot accept revocation.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Revocation reason violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT access token
      description: RFC 6750 bearer access token; ID tokens are rejected.
  headers:
    RevisionETag:
      description: Strong ETag for one concrete immutable revision.
      required: true
      schema:
        type: string
        pattern: '^"revision:[1-9][0-9]*:sha256:[0-9a-f]{64}"$'
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PluginPackageId:
      name: package_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IfMatchRevision:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the expected current revision.
      schema:
        type: string
        pattern: '^"revision:[1-9][0-9]*:sha256:[0-9a-f]{64}"$'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: cmp-api
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    RevisionMetadata:
      $ref: ../revisions/revision-metadata.schema.json
    MeResponse:
      $ref: ../identity/me-response.schema.json
    AuthenticationProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, trace_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        code: {type: string, pattern: '^CMP-[A-Z]+-[0-9]{4}$'}
        trace_id:
          type: string
          pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    SubmitJobRequest:
      $ref: ../jobs/job-submission.schema.json
    ControlJobRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
    JobResponse:
      $ref: ../jobs/job-resource.schema.json
    JobProblem:
      $ref: ../jobs/job-problem.schema.json
    RegisterPluginPackageRequest:
      $ref: ../plugins/plugin-package-registration.schema.json
    ControlPluginPackageRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
    PluginPackageResponse:
      $ref: ../plugins/plugin-package-resource.schema.json
    PluginProblem:
      $ref: ../plugins/plugin-problem.schema.json

