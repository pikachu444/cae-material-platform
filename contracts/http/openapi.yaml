openapi: 3.1.0
info:
  title: CAE Material Platform API
  summary: Material data management, immutable traceability, and CAE workflow platform.
  version: 0.32.0
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/product-access/me:
    get:
      operationId: getEffectiveProductAccess
      tags: [identity]
      summary: Return the effective Administrator/User role and product feature grants.
      security: [{BearerAuth: []}]
      responses:
        "200":
          description: Product-facing access projection, including legacy-binding compatibility.
          content:
            application/json:
              schema: {$ref: "../identity/product-access-resources.schema.json#/$defs/Summary"}
        "401": {description: Authentication required.}
        "503": {description: Product access is not configured.}
  /api/v1/product-access/assignments:
    get:
      operationId: listProductAccessAssignments
      tags: [identity]
      summary: List product assignments visible to an Administrator in the selected scope.
      security: [{BearerAuth: []}]
      responses:
        "200":
          description: Current and revoked typed product assignments.
          content:
            application/json:
              schema: {$ref: "../identity/product-access-resources.schema.json#/$defs/AssignmentList"}
        "401": {description: Authentication required.}
        "403": {description: Administrator access is required.}
    post:
      operationId: grantProductAccess
      tags: [identity]
      summary: Append an Administrator/User assignment with explicit product feature grants.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../identity/product-access-resources.schema.json#/$defs/GrantRequest"}
      responses:
        "201":
          description: Immutable product assignment.
          content:
            application/json:
              schema: {$ref: "../identity/product-access-resources.schema.json#/$defs/Assignment"}
        "401": {description: Authentication required.}
        "403": {description: Administrator access is required.}
        "409": {description: The subject already has an active assignment in the selected scope.}
        "422": {description: Subject, feature, scope, or validity data is invalid.}
  /api/v1/product-access/assignments/{assignment_id}/revoke:
    post:
      operationId: revokeProductAccess
      tags: [identity]
      summary: Revoke an assignment without mutating its original grants.
      security: [{BearerAuth: []}]
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../identity/product-access-resources.schema.json#/$defs/RevokeRequest"}
      responses:
        "204": {description: Assignment revoked.}
        "401": {description: Authentication required.}
        "403": {description: Administrator access is required.}
        "404": {description: Assignment is missing or outside the selected scope.}
  /api/v1/test-data:validate:
    post:
      operationId: validateCanonicalTestData
      tags: [test-data-json]
      summary: Validate and preview one solver- and test-method-neutral cmp.test-data JSON document.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../datasets/canonical-test-data.schema.json"}
      responses:
        "200":
          description: Semantic preview with deterministic canonical digest and explicit units.
          content:
            application/json:
              schema: {$ref: "../datasets/canonical-test-data-resources.schema.json#/$defs/PreviewResponse"}
        "401": {description: Authentication required.}
        "403": {description: Dataset write is not authorized.}
        "422": {description: Schema, array, missingness, or explicit normalization is invalid.}
  /api/v1/test-data:convert-tabular:
    post:
      operationId: convertTabularToCanonicalTestData
      tags: [test-data-json]
      summary: Convert approved CSV, TSV, or XLSX mapping evidence into cmp.test-data JSON.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../datasets/canonical-test-data-resources.schema.json#/$defs/TabularConvertRequest"}
      responses:
        "200":
          description: Canonical preview preserving original and normalized values and units.
          content:
            application/json:
              schema: {$ref: "../datasets/canonical-test-data-resources.schema.json#/$defs/PreviewResponse"}
        "401": {description: Authentication required.}
        "403": {description: Dataset write is not authorized.}
        "422": {description: File, profile, mapping, unit, geometry, or canonical semantics are invalid.}
  /api/v1/test-data-documents:
    post:
      operationId: importCanonicalTestData
      tags: [test-data-json]
      summary: Import canonical Test Data as a stable identity and immutable revision with JSON and normalized artifacts.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../datasets/canonical-test-data-resources.schema.json#/$defs/ImportRequest"}
      responses:
        "201":
          description: Immutable Test Data revision and exact Artifact pins.
          content:
            application/json:
              schema: {$ref: "../datasets/canonical-test-data-resources.schema.json#/$defs/DocumentResponse"}
        "401": {description: Authentication required.}
        "403": {description: Dataset write is not authorized.}
        "409": {description: Exact evidence, scope, or document identity conflicts.}
        "422": {description: Canonical Test Data semantics are invalid.}
    get:
      operationId: listCanonicalTestDataDocuments
      tags: [test-data-json]
      summary: List current immutable Test Data revisions visible in the selected project.
      security: [{BearerAuth: []}]
      responses:
        "200":
          description: Current Test Data revision summaries.
          content:
            application/json:
              schema: {$ref: "../datasets/canonical-test-data-resources.schema.json#/$defs/DocumentListResponse"}
        "401": {description: Authentication required.}
        "403": {description: Dataset read is not authorized.}
  /api/v1/test-data-documents/{document_id}/revisions/{revision_id}/content:
    get:
      operationId: downloadCanonicalTestDataRevision
      tags: [test-data-json]
      summary: Download the canonical JSON artifact pinned by one exact Test Data revision.
      security: [{BearerAuth: []}]
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: revision_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Exact canonical Test Data JSON bytes.
          headers:
            X-Content-SHA256: {schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
          content:
            application/vnd.cmp.test-data+json:
              schema: {type: string, format: binary}
        "401": {description: Authentication required.}
        "403": {description: Dataset read is not authorized.}
        "404": {description: The exact Test Data revision is not visible.}
        "409": {description: Stored artifact digest evidence is inconsistent.}
  /api/v1/test-data-documents/{document_id}/revisions:
    post:
      operationId: reviseCanonicalTestData
      tags: [test-data-json]
      summary: Append an immutable canonical Test Data revision using an exact current ETag.
      security: [{BearerAuth: []}]
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../datasets/canonical-test-data-resources.schema.json#/$defs/ReviseRequest"}
      responses:
        "201":
          description: Newly appended Test Data revision with new exact Artifact pins.
          content:
            application/json:
              schema: {$ref: "../datasets/canonical-test-data-resources.schema.json#/$defs/DocumentResponse"}
        "401": {description: Authentication required.}
        "403": {description: Dataset write is not authorized.}
        "404": {description: Test Data identity is not visible.}
        "409": {description: Stable document identity or immutable evidence conflicts.}
        "412": {description: If-Match names a stale revision.}
        "422": {description: Canonical Test Data semantics are invalid.}
        "428": {description: A strong exact-revision If-Match header is required.}
  /api/v1/test-data-packages:download:
    post:
      operationId: downloadCanonicalTestDataPackage
      tags: [test-data-json]
      summary: Download 1..100 exact Test Data revisions in a deterministic checksum-verifiable ZIP.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../datasets/canonical-test-data-resources.schema.json#/$defs/PackageRequest"}
      responses:
        "200":
          description: Deterministic package with manifest, checksums and canonical JSON files.
          headers:
            X-Content-SHA256: {schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
          content:
            application/vnd.cmp.test-data-package+zip:
              schema: {type: string, format: binary}
        "401": {description: Authentication required.}
        "403": {description: Dataset read is not authorized.}
        "404": {description: One exact Test Data revision is not visible.}
        "409": {description: Selection or immutable Artifact evidence conflicts.}
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report API process health.
      responses:
        "200":
          description: The API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/demo-identity/token:
    get:
      operationId: issueLocalDemoAccessToken
      tags: [development]
      summary: Issue a short-lived token for the explicit local demo tenant.
      description: >-
        Available only when the API was explicitly started with CMP_ENVIRONMENT=demo
        and CMP_DEMO_IDENTITY=true. It is not present in normal or production deployments.
      responses:
        "200":
          description: A signed, 15-minute synthetic demo access token.
          headers:
            Cache-Control:
              required: true
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DemoAccessTokenResponse"}
        "404":
          description: The explicit local demo identity composition is disabled.
  /api/v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Return the authenticated principal and selected tenant context.
      security:
        - BearerAuth: []
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema: {type: string, format: uuid}
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
            pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      responses:
        "200":
          description: Authenticated principal and request security context.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          description: Request or trace identifier is malformed.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
        "401":
          description: Bearer access token is missing or invalid.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
            WWW-Authenticate:
              schema: {type: string}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
        "403":
          description: Principal is inactive or not provisioned.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
        "503":
          description: OIDC authentication is not configured or temporarily unavailable.
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/AuthenticationProblem"}
  /api/v1/operations/observability:
    get:
      operationId: getOperationalObservability
      tags: [operations]
      summary: Read a redacted, low-cardinality process observability snapshot.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: One API process snapshot using bounded route-template labels.
          headers:
            Cache-Control:
              required: true
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationalSnapshotResponse"}
        "401": {description: Authentication required}
        "403": {description: Auditor permission required}
        "503": {description: Identity or authorization service unavailable}
  /api/v1/jobs:
    post:
      operationId: submitJob
      tags: [jobs]
      summary: Submit one immutable Job Spec for durable execution.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[\x21-\x7e]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubmitJobRequest"}
      responses:
        "202":
          description: Job accepted or an identical idempotent submission replayed.
          headers:
            Location:
              required: true
              schema: {type: string}
            Idempotent-Replay:
              required: true
              schema: {type: string, enum: ["true", "false"]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobResponse"}
        "401": {description: Authentication required}
        "403": {description: Job submission is not authorized}
        "409":
          description: Idempotency key or stable Job identity conflict.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "422":
          description: Job Spec or resource policy violates its contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "503":
          description: Durable job service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
  /api/v1/jobs/{job_id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Return job, attempt, progress, and terminal result references.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Tenant-scoped durable Job resource.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobResponse"}
        "401": {description: Authentication required}
        "403": {description: Job read is not authorized}
        "404":
          description: No visible Job matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "422":
          description: Job identifier violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "503":
          description: Durable job service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
  /api/v1/jobs/{job_id}:cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Request cooperative cancellation without deleting execution facts.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlJobRequest"}
      responses:
        "202":
          description: Cancellation requested or queued work cancelled atomically.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobResponse"}
        "401": {description: Authentication required}
        "403": {description: Job control is not authorized}
        "404":
          description: No visible Job matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "409":
          description: Job is already terminal with a non-cancel outcome.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "422":
          description: Cancellation request violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "503":
          description: Durable job service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
  /api/v1/jobs/{job_id}:retry:
    post:
      operationId: retryJob
      tags: [jobs]
      summary: Append a new attempt for a retryable terminal job.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlJobRequest"}
      responses:
        "202":
          description: A distinct immutable Attempt and Job Spec were appended.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobResponse"}
        "401": {description: Authentication required}
        "403": {description: Job control is not authorized}
        "404":
          description: No visible Job matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "409":
          description: State, immutable input, deadline, or attempt cap forbids retry.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "422":
          description: Retry request violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
        "503":
          description: Durable job service unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/JobProblem"}
  /api/v1/plugins/packages:
    post:
      operationId: registerPluginPackage
      tags: [plugins]
      summary: Register one immutable manifest, package digest, and schema bundle.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[\x21-\x7e]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterPluginPackageRequest"}
      responses:
        "201":
          description: Immutable package registered or an identical submission replayed.
          headers:
            Location:
              required: true
              schema: {type: string}
            Idempotent-Replay:
              required: true
              schema: {type: string, enum: ["true", "false"]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin package submission is not authorized}
        "409":
          description: Plugin/version, digest, or idempotency identity conflict.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Manifest, artifact reference, or schema violates its contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/plugins/packages/{package_id}:
    get:
      operationId: getPluginPackage
      tags: [plugins]
      summary: Read an immutable package and its append-only state history.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginPackageId"
      responses:
        "200":
          description: Tenant-scoped immutable plugin package resource.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin package read is not authorized}
        "404":
          description: No visible package matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Package identifier violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/plugins/packages/{package_id}:verify:
    post:
      operationId: verifyPluginPackage
      tags: [plugins]
      summary: Record operator verification of signature, SBOM, and policy evidence.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginPackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlPluginPackageRequest"}
      responses:
        "200":
          description: Package became activation-eligible or was already eligible.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin verification is not authorized}
        "404":
          description: No visible package matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "409":
          description: Package state cannot accept verification.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Verification reason violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/plugins/packages/{package_id}:activate:
    post:
      operationId: activatePluginPackage
      tags: [plugins]
      summary: Append the project allowlist activation for an eligible package.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginPackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlPluginPackageRequest"}
      responses:
        "200":
          description: Project-scoped package activation appended or replayed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin activation is not authorized}
        "404":
          description: No visible package matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "409":
          description: Package is not eligible, is revoked, or already terminal.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Activation reason violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/plugins/packages/{package_id}:revoke:
    post:
      operationId: revokePluginPackage
      tags: [plugins]
      summary: Append revocation without deleting historical package identity.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginPackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlPluginPackageRequest"}
      responses:
        "200":
          description: Package revocation appended or replayed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PluginPackageResponse"}
        "401": {description: Authentication required}
        "403": {description: Plugin revocation is not authorized}
        "404":
          description: No visible package matches the opaque identifier.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "409":
          description: Package state cannot accept revocation.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "422":
          description: Revocation reason violates the command contract.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
        "503":
          description: Plugin registry unavailable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/PluginProblem"}
  /api/v1/uploads:
    post:
      operationId: createUploadSession
      tags: [artifacts]
      summary: Create a resumable digest-pinned multipart upload session.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateUploadRequest"}
      responses:
        "201":
          description: Upload session created or replayed.
          headers:
            Location: {required: true, schema: {type: string}}
            Idempotent-Replay: {required: true, schema: {type: string, enum: ["true", "false"]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreateUploadResponse"}
        "409": {description: Idempotency or upload conflict.}
        "422": {description: Invalid upload manifest.}
        "503": {description: Upload service unavailable.}
  /api/v1/uploads/{upload_id}:
    get:
      operationId: getUploadSession
      tags: [artifacts]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Tenant-visible upload session and immutable part manifest.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSessionResponse"}
        "404": {description: Upload session not visible.}
  /api/v1/uploads/{upload_id}/parts/{part_number}:
    put:
      operationId: uploadPart
      tags: [artifacts]
      summary: Stream one immutable upload part.
      security:
