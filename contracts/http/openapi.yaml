components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT access token
      description: RFC 6750 bearer access token; ID tokens are rejected.
  headers:
    RevisionETag:
      description: Strong ETag for one concrete immutable revision.
      required: true
      schema:
        type: string
        pattern: '^"revision:[1-9][0-9]*:sha256:[0-9a-f]{64}"$'
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MaterialId:
      name: material_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MaterialStateId:
      name: material_state_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PropertySetId:
      name: property_set_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MaterialModelId:
      name: material_model_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SolverCardId:
      name: solver_card_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PluginPackageId:
      name: package_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RawAssetId:
      name: raw_asset_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProvenanceEntityId:
      name: entity_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IfMatchRevision:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the expected current revision.
      schema:
        type: string
        pattern: '^"revision:[1-9][0-9]*:sha256:[0-9a-f]{64}"$'
  schemas:
    OgdenPronyTarget:
      type: object
      additionalProperties: false
      required: [solver, version, unit_system]
      properties:
        solver: {type: string, enum: [abaqus, openradioss]}
        version: {type: string, const: "2025"}
        unit_system: {type: string, const: kg_m_s}
    OgdenPronyTerm:
      type: object
      additionalProperties: false
      required: [g_ratio, relaxation_time_s]
      properties:
        g_ratio: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
        relaxation_time_s: {type: number, exclusiveMinimum: 0}
    OgdenPronyModelCreateRequest:
      type: object
      additionalProperties: false
      required: [property_set_revision_id, ogden_mu_pa, ogden_alpha, prony_terms, change_reason]
      properties:
        property_set_revision_id: {type: string, format: uuid}
        ogden_mu_pa: {type: number, exclusiveMinimum: 0}
        ogden_alpha: {type: number, exclusiveMinimum: 0}
        prony_terms:
          type: array
          minItems: 1
          maxItems: 5
          items: {$ref: "#/components/schemas/OgdenPronyTerm"}
        change_reason: {type: string, minLength: 1, maxLength: 2000}
    OgdenPronyPreflightRequest:
      type: object
      additionalProperties: false
      required: [material_model_revision_id, target]
      properties:
        material_model_revision_id: {type: string, format: uuid}
        target: {$ref: "#/components/schemas/OgdenPronyTarget"}
    OgdenPronyCardCreateRequest:
      type: object
      additionalProperties: false
      required:
        [material_model_revision_id, target, expected_mapping_report_sha256,
         solver_material_id, material_name, change_reason]
      properties:
        material_model_revision_id: {type: string, format: uuid}
        target: {$ref: "#/components/schemas/OgdenPronyTarget"}
        expected_mapping_report_sha256:
          {type: string, pattern: '^[0-9a-f]{64}$'}
        solver_material_id: {type: integer, minimum: 1, maximum: 9999999999}
        material_name:
          {type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{0,79}$'}
        change_reason: {type: string, minLength: 1, maxLength: 2000}
    OgdenPronyMappingItem:
      type: object
      additionalProperties: false
      required: [name, ir_path, target_representation, status, detail]
      properties:
        name: {type: string, minLength: 1}
        ir_path: {type: string, minLength: 1}
        target_representation: {type: [string, "null"]}
        status:
          type: string
          enum: [exact, transformed, approximated, ignored, unsupported, not_applicable]
        detail: {type: string, minLength: 1}
    OgdenPronyMappingReportResponse:
      type: object
      additionalProperties: false
      required: [mapping_report_sha256, exportable, report]
      properties:
        mapping_report_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        exportable: {type: boolean}
        report:
          type: object
          required: [material_model_id, material_model_revision_id, target, items, exporter,
            model_schema_digest, non_production]
          properties:
            material_model_id: {type: string, format: uuid}
            material_model_revision_id: {type: string, format: uuid}
            model_schema_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
            target: {$ref: "#/components/schemas/OgdenPronyTarget"}
            items:
              type: array
              minItems: 1
              items: {$ref: "#/components/schemas/OgdenPronyMappingItem"}
            exporter: {type: object}
            non_production: {type: boolean, const: true}
    OgdenPronyModelResponse:
      type: object
      additionalProperties: false
      required: [material_model_id, material_state_id, current_revision, links]
      properties:
        material_model_id: {type: string, format: uuid}
        material_state_id: {type: string, format: uuid}
        current_revision: {type: object}
        links: {type: object, additionalProperties: {type: string}}
    OgdenPronyCardResponse:
      type: object
      additionalProperties: false
      required: [solver_card_id, material_model_id, target, current_revision, links]
      properties:
        solver_card_id: {type: string, format: uuid}
        material_model_id: {type: string, format: uuid}
        target: {$ref: "#/components/schemas/OgdenPronyTarget"}
        current_revision: {type: object}
        links: {type: object, additionalProperties: {type: string}}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: cmp-api
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    OperationSeriesResponse:
      type: object
      additionalProperties: false
      required:
        [method, route, status_family, request_count, error_count, duration_sum_ms, p95_upper_bound_ms]
      properties:
        method: {type: string, pattern: '^(_OTHER|[A-Z]+)$'}
        route: {type: string, minLength: 1, maxLength: 255}
        status_family: {type: string, pattern: '^([1-5]xx|error)$'}
        request_count: {type: integer, minimum: 1}
        error_count: {type: integer, minimum: 0}
        duration_sum_ms: {type: number, minimum: 0}
        p95_upper_bound_ms: {type: integer, minimum: 1}
    OperationalSnapshotResponse:
      type: object
      additionalProperties: false
      required:
        [service, version, started_at, observed_at, active_requests, request_count, error_count, series]
      properties:
        service: {type: string, const: cmp-api}
        version: {type: string, minLength: 1, maxLength: 255}
        started_at: {type: string, format: date-time}
        observed_at: {type: string, format: date-time}
        active_requests: {type: integer, minimum: 0}
        request_count: {type: integer, minimum: 0}
        error_count: {type: integer, minimum: 0}
        series:
          type: array
          items: {$ref: "#/components/schemas/OperationSeriesResponse"}
    DemoAccessTokenResponse:
      type: object
      additionalProperties: false
      required:
        [access_token, token_type, expires_in_seconds, organization_id, project_id, group]
      properties:
        access_token: {type: string, minLength: 1}
        token_type: {type: string, enum: [Bearer]}
        expires_in_seconds: {type: integer, minimum: 1}
        organization_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        group: {type: string, minLength: 1}
    RevisionMetadata:
      $ref: ../revisions/revision-metadata.schema.json
    MeResponse:
      $ref: ../identity/me-response.schema.json
    AuthenticationProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, trace_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        code: {type: string, pattern: '^CMP-[A-Z]+-[0-9]{4}$'}
        trace_id:
          type: string
          pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    SubmitJobRequest:
      $ref: ../jobs/job-submission.schema.json
    ControlJobRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
    JobResponse:
      $ref: ../jobs/job-resource.schema.json
    JobProblem:
      $ref: ../jobs/job-problem.schema.json
    RegisterPluginPackageRequest:
      $ref: ../plugins/plugin-package-registration.schema.json
    ControlPluginPackageRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
    PluginPackageResponse:
      $ref: ../plugins/plugin-package-resource.schema.json
    PluginProblem:
      $ref: ../plugins/plugin-problem.schema.json
    CreateUploadRequest:
      $ref: ../artifacts/upload-session-create.schema.json
    CreateUploadResponse:
      $ref: ../artifacts/upload-create-response.schema.json
    UploadSessionResponse:
      $ref: ../artifacts/upload-session-resource.schema.json
    CompleteUploadResponse:
      $ref: ../artifacts/upload-completion.schema.json
    RawAssetResponse:
      $ref: ../artifacts/raw-asset-resource.schema.json
    UploadProblem:
      $ref: ../artifacts/upload-problem.schema.json
    ArtifactResponse:
      $ref: ../artifacts/artifact-resource.schema.json
    ArtifactDownloadGrant:
      $ref: ../artifacts/artifact-download-grant.schema.json
    ArtifactProblem:
      $ref: ../artifacts/artifact-problem.schema.json
    ProvenanceEntityResponse:
      $ref: ../provenance/provenance-entity-resource.schema.json
    ProvenanceLineageResponse:
      $ref: ../provenance/provenance-lineage.schema.json
    ProvenanceCompletenessResponse:
      $ref: ../provenance/provenance-completeness.schema.json
    ProvenanceProblem:
      $ref: ../provenance/provenance-problem.schema.json
    AuditEventPageResponse:
      $ref: ../audit/audit-event-page.schema.json
    AuditIntegrityResponse:
      $ref: ../audit/audit-integrity.schema.json
    AuditExportResponse:
      $ref: ../audit/audit-export.schema.json
    AuditProblem:
      $ref: ../audit/audit-problem.schema.json
    MaterialDetailResponse:
      type: object
      additionalProperties: false
      required: [material, states, property_sets]
      properties:
        material: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialResponse"}
        states:
          type: array
          items: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialStateResponse"}
        property_sets:
          type: array
          items: {$ref: "../catalog/catalog-resources.schema.json#/$defs/PropertySetResponse"}
    MaterialRevisionComparisonResponse:
      type: object
      additionalProperties: false
