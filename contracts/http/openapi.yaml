      summary: Download the immutable reference Release package.
      security: [{BearerAuth: []}]
      parameters:
        - name: release_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Digest-fixed Release manifest package bytes.
          headers:
            ETag: {$ref: "#/components/headers/RevisionETag"}
          content:
            application/vnd.cmp.release-manifest+json:
              schema: {type: string, format: binary}
        "401": {description: Authentication required.}
        "403": {description: Release read is not authorized.}
        "404": {description: No visible Release matches.}
        "503": {description: Release service unavailable.}
  /api/v1/releases/{release_id}/supersede:
    post:
      operationId: supersedeRelease
      tags: [governance, release]
      summary: Mark a released package superseded by an explicit successor Release.
      security: [{BearerAuth: []}]
      parameters:
        - name: release_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../governance/release-resources.schema.json#/$defs/SupersedeReleaseRequest"}
      responses:
        "200":
          description: The immutable Release with its terminal superseded projection.
          content:
            application/json:
              schema: {$ref: "../governance/release-resources.schema.json#/$defs/ReleaseResponse"}
        "401": {description: Authentication required.}
        "403": {description: Release publish is not authorized.}
        "404": {description: No visible Release or successor matches.}
        "409": {description: Lifecycle or successor conflict.}
        "422": {description: Typed transition input is invalid.}
        "503": {description: Release service unavailable.}
  /api/v1/releases/{release_id}/withdraw:
    post:
      operationId: withdrawRelease
      tags: [governance, release]
      summary: Withdraw a released package without deleting its immutable artifact.
      security: [{BearerAuth: []}]
      parameters:
        - name: release_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../governance/release-resources.schema.json#/$defs/WithdrawReleaseRequest"}
      responses:
        "200":
          description: The immutable Release with its terminal withdrawn projection.
          content:
            application/json:
              schema: {$ref: "../governance/release-resources.schema.json#/$defs/ReleaseResponse"}
        "401": {description: Authentication required.}
        "403": {description: Release publish is not authorized.}
        "404": {description: No visible Release matches.}
        "409": {description: Lifecycle conflict.}
        "422": {description: Typed transition input is invalid.}
        "503": {description: Release service unavailable.}
  /api/v1/releases/{release_id}/usage:
    post:
      operationId: recordReleaseUsage
      tags: [governance, release]
      summary: Record an explicit consume event for a released package.
      security: [{BearerAuth: []}]
      parameters:
        - name: release_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../governance/release-resources.schema.json#/$defs/RecordReleaseUsageRequest"}
      responses:
        "201":
          description: Immutable usage fact.
          content:
            application/json:
              schema: {$ref: "../governance/release-resources.schema.json#/$defs/ReleaseUsageResponse"}
        "401": {description: Authentication required.}
        "403": {description: Release read is not authorized.}
        "404": {description: No visible Release matches.}
        "409": {description: Release is terminal or usage conflicts.}
        "422": {description: Typed usage input is invalid.}
        "503": {description: Release service unavailable.}
  /api/v1/releases/{release_id}/impact:
    get:
      operationId: getReleaseImpact
      tags: [governance, release]
      summary: Read replacement links, usage facts, and lifecycle warnings.
      security: [{BearerAuth: []}]
      parameters:
        - name: release_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Release lifecycle impact report.
          content:
            application/json:
              schema: {$ref: "../governance/release-resources.schema.json#/$defs/ReleaseImpactResponse"}
        "401": {description: Authentication required.}
        "403": {description: Release read is not authorized.}
        "404": {description: No visible Release matches.}
        "503": {description: Release service unavailable.}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT access token
      description: RFC 6750 bearer access token; ID tokens are rejected.
  headers:
    RevisionETag:
      description: Strong ETag for one concrete immutable revision.
      required: true
      schema:
        type: string
        pattern: '^"revision:[1-9][0-9]*:sha256:[0-9a-f]{64}"$'
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MaterialId:
      name: material_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MaterialStateId:
      name: material_state_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PropertySetId:
      name: property_set_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MaterialModelId:
      name: material_model_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SolverCardId:
      name: solver_card_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PluginPackageId:
      name: package_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RawAssetId:
      name: raw_asset_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProvenanceEntityId:
      name: entity_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IfMatchRevision:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the expected current revision.
      schema:
        type: string
        pattern: '^"revision:[1-9][0-9]*:sha256:[0-9a-f]{64}"$'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: cmp-api
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    DemoAccessTokenResponse:
      type: object
      additionalProperties: false
      required:
        [access_token, token_type, expires_in_seconds, organization_id, project_id, group]
      properties:
        access_token: {type: string, minLength: 1}
        token_type: {type: string, enum: [Bearer]}
        expires_in_seconds: {type: integer, minimum: 1}
        organization_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        group: {type: string, minLength: 1}
    RevisionMetadata:
      $ref: ../revisions/revision-metadata.schema.json
    MeResponse:
      $ref: ../identity/me-response.schema.json
    AuthenticationProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, trace_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        code: {type: string, pattern: '^CMP-[A-Z]+-[0-9]{4}$'}
        trace_id:
          type: string
          pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    SubmitJobRequest:
      $ref: ../jobs/job-submission.schema.json
    ControlJobRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
    JobResponse:
      $ref: ../jobs/job-resource.schema.json
    JobProblem:
      $ref: ../jobs/job-problem.schema.json
    RegisterPluginPackageRequest:
      $ref: ../plugins/plugin-package-registration.schema.json
    ControlPluginPackageRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
    PluginPackageResponse:
      $ref: ../plugins/plugin-package-resource.schema.json
    PluginProblem:
      $ref: ../plugins/plugin-problem.schema.json
    CreateUploadRequest:
      $ref: ../artifacts/upload-session-create.schema.json
    CreateUploadResponse:
      $ref: ../artifacts/upload-create-response.schema.json
    UploadSessionResponse:
      $ref: ../artifacts/upload-session-resource.schema.json
    CompleteUploadResponse:
      $ref: ../artifacts/upload-completion.schema.json
    RawAssetResponse:
      $ref: ../artifacts/raw-asset-resource.schema.json
    UploadProblem:
      $ref: ../artifacts/upload-problem.schema.json
    ArtifactResponse:
      $ref: ../artifacts/artifact-resource.schema.json
    ArtifactDownloadGrant:
      $ref: ../artifacts/artifact-download-grant.schema.json
    ArtifactProblem:
      $ref: ../artifacts/artifact-problem.schema.json
    ProvenanceEntityResponse:
      $ref: ../provenance/provenance-entity-resource.schema.json
    ProvenanceLineageResponse:
      $ref: ../provenance/provenance-lineage.schema.json
    ProvenanceCompletenessResponse:
      $ref: ../provenance/provenance-completeness.schema.json
    ProvenanceProblem:
      $ref: ../provenance/provenance-problem.schema.json
    AuditEventPageResponse:
      $ref: ../audit/audit-event-page.schema.json
    AuditIntegrityResponse:
      $ref: ../audit/audit-integrity.schema.json
    AuditExportResponse:
      $ref: ../audit/audit-export.schema.json
    AuditProblem:
      $ref: ../audit/audit-problem.schema.json
    MaterialDetailResponse:
      type: object
      additionalProperties: false
      required: [material, states, property_sets]
      properties:
        material: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialResponse"}
        states:
          type: array
          items: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialStateResponse"}
        property_sets:
          type: array
          items: {$ref: "../catalog/catalog-resources.schema.json#/$defs/PropertySetResponse"}
    MaterialRevisionComparisonResponse:
      type: object
      additionalProperties: false
      required: [material_id, left, right, changed_fields]
      properties:
        material_id: {type: string, format: uuid}
        left: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialRevision"}
        right: {$ref: "../catalog/catalog-resources.schema.json#/$defs/MaterialRevision"}
        changed_fields:
          type: array
          items: {type: string, minLength: 1, maxLength: 255}

