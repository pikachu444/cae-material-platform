semantic_acceptance:
  primary: 'shared --ux-accent #245ea8; one filled primary per task context'
  neutral: shared surface, border, and text tokens
  tertiary: shared text-style ux-button primitive
  danger: shared --ux-danger and --ux-danger-soft tokens
  success: status-only; not used for general primary actions
  disabled: shared 0.5 opacity and not-allowed cursor
  loading: aria-busy=true, progress cursor, 0.72 opacity
  geometry: 36px height, 4px radius, no shadow
  focus: shared 3px --ux-focus-ring outline
  legacy_global_rule_changed: false
  administration_specific_color_override_added: false
  backend_or_contract_behavior_changed: false
