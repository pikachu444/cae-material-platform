journey:
  - keep No database selected while explicitly choosing independent Demo Material Records Revision 1
  - select Layout stable identity and exact Layout revision
  - preview DP780 Record stable identity and exact Record Revision 2
  - reload the exact URL without latest or first-item substitution
  - open the same exact Table Folder Record coordinates in Records
  - create a Record Revision 1 then revise it to Revision 2 and retain the returned exact read-back after reload
  - inspect a checksummed Format Definition plan and immutable application coordinate
  - grant then remove one exact Reviewer assignment and verify the immutable assignment list read-back
contracts:
  stable_identity_and_revision: [database_id, profile_id, table_id, attribute_definition_id, layout_id, subset_id, link_type_id, folder_id, record_id, current_revision.id, current_revision.revision_no, current_revision.content_hash]
  exact_url_state: [database_revision_id, profile_revision_id, table_revision_id, object_revision_id, folder_revision_id, record_revision_id, application_id]
  record_values: [attribute_definition_id, attribute_definition_revision_id, folder_revision_id, values]
  format_definition: [source_artifact.artifact_id, source_artifact.artifact_sha256, plan_fingerprint, application_id, results.id, results.revision_id, results.content_hash]
  forbidden_fallbacks: [latest, first-item, global-output, other-session]
ownership:
