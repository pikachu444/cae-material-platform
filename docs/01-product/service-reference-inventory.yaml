policy:
  normal_viewports:
    - key: 1366x768
      width: 1366
      height: 768
    - key: 1440x900
      width: 1440
      height: 900
    - key: 1920x1080
      width: 1920
      height: 1080
  exceptional_image_viewport:
    key: 1440x900
    width: 1440
    height: 900
  exceptional_responsive_evidence:
    - 1366x768
    - 1440x900
    - 1920x1080
  additional_exception_image_rule: >-
    Add a compact or wide exceptional-state image only after deterministic evidence proves that the
    state changes responsive topology. Any addition requires an inventory version bump and
    product-owner approval.
  approval: >-
    One product-owner response may approve a batch, but it must identify every image path and
    SHA-256. Each target keeps an independent manifest lifecycle.
  parallelism: >-
    At most two dependency-independent bundles may have writers at once. Writers own disjoint
    family sources, capture scripts and image directories; the main agent alone integrates this
    inventory, the common manifest and the common evidence report.
