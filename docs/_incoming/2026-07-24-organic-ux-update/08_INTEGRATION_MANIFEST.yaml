schema_version: "2.0"
created_at: "2026-07-24"
language: "ko"

baseline:
  repository: "pikachu444/cae-material-platform"
  branch: "main"
  audited_commit: "d16d925d71310d940f93ed5707e7bc229e4c4809"
  merged_pr: 124
  completed_work_items:
    - "DUI-01"
    - "DUI-02"
    - "DUI-03"
    - "DUI-04"
    - "DUI-05"
    - "DUI-06"
  pending_work_items:
    - "DUI-07"
    - "DUI-08"
    - "DUI-09"
  review_gate:
    issue: 119
    state: "on_hold"
    automatic_llm_review: false

package_policy:
  commit_package_directory: false
  merge_into_existing_tree: true
  replace_previous_reference_pack: true
  previous_pack_current_diagnosis_valid: false
  keep_historical_evidence: true
  implementation_entrypoint: "CODEX_DESKTOP_ENGINEERING_UI_START.md"

document_roles:
  authoritative:
    "AGENTS.md": "repository-wide product and implementation invariants"
    "CODEX_DESKTOP_ENGINEERING_UI_START.md": "single Codex execution entrypoint"
    "docs/01-product/product-vision.md": "product boundary, value, non-goals"
    "docs/01-product/desktop-engineering-user-flows.md": "user goals, state transitions, recovery"
    "docs/01-product/desktop-engineering-ui-product-spec.md": "screen information architecture and work interactions"
    "docs/01-product/desktop-engineering-ui-spec.md": "component rationale, placement, visibility, states, keyboard, forbidden patterns"
    "docs/01-product/visual-acceptance-matrix.md": "measurable visual and accessibility gates"
    "docs/13-delivery/desktop-engineering-ui-backlog.md": "implementation status and ordering"
  reference:
    "docs/00-research/official-product-research.md": "verified external product behavior"
    "docs/00-research/product-capability-map.md": "reference-to-product boundary mapping"
    "docs/00-research/ux-reference-gallery/": "sourced interface observations"
    "docs/00-research/images/gui-reference/": "sourced reference images"
    "docs/00-research/product-reference-source-catalog.json": "structured official sources"
  current:
    - "README.md"
    - "IMPLEMENTATION_STATUS.md"
    - "docs/README.md"
    - "docs/design-index.md"
    - "docs/user-guide/**"
    - "docs/user-guide/navigation-contract.yaml"
    - "docs/user-guide/screenshot-manifest.yaml"
  historical:
    - "docs/17-evidence/**"
    - "docs/13-delivery/implementation-history.md"
    - "docs/17-evidence/screenshot-archive.yaml"

document_actions:
  update:
    - path: "CODEX_DESKTOP_ENGINEERING_UI_START.md"
      reason: "pre-PR-124 merge state is stale"
    - path: "docs/01-product/desktop-engineering-ui-program-brief.md"
      reason: "old draft and blocking statements are stale"
    - path: "docs/13-delivery/desktop-engineering-ui-backlog.md"
      reason: "DUI-06 must be marked merged; corrective workstream must precede DUI-07"
    - path: "docs/user-guide/navigation-contract.yaml"
      reason: "Modeling Data/Process/Fit/Export ownership and pending Activity scope are incomplete"
    - path: "docs/design-index.md"
      reason: "authoritative reading order and status are stale"
    - path: "docs/README.md"
      reason: "canonical UI spec, user flows, and visual matrix are missing from portal"
    - path: "IMPLEMENTATION_STATUS.md"
      reason: "PR-124 chain and remaining validation/invalidation gaps must be separated"
  recapture_then_update:
    - path: "docs/user-guide/screenshot-manifest.yaml"
      current_source_commit: "117551a"
      required_source: "latest main at capture time"
      prohibit_sha_only_edit: true
  merge_then_delete:
    - "docs/01-product/product-experience-spec.md"
    - "docs/01-product/ux-visual-system.md"
    - "docs/01-product/gui-functional-parity-plan.md"
    - "CODEX_UX_REDESIGN_START.md"
    - "docs/01-product/ux-redesign-package/README.md"
    - "docs/01-product/ux-redesign-package/00_UX_REDESIGN_GOAL.md"
    - "docs/01-product/ux-redesign-package/01_RESEARCH_EVIDENCE_AND_COLLECTION.md"
    - "docs/01-product/ux-redesign-package/02_UX_REDESIGN_EXECUTION_PLAN.md"
    - "docs/01-product/ux-redesign-package/03_UX_ACCEPTANCE_CRITERIA.md"
    - "docs/01-product/ux-redesign-package/04_CODEX_MASTER_PROMPT.md"
    - "docs/01-product/ux-redesign-package/05_REFERENCE_SOURCES.md"
  never_delete:
    - "docs/17-evidence/**"
    - "official reference images and manifests"
    - "screenshot archive"
    - "domain and architecture decisions"
    - "calculation, unit, revision, provenance, solver, and plugin contracts"

component_contract_required_fields:
  - "user_job"
  - "why"
  - "placement"
  - "visible_when"
  - "source"
  - "requires"
  - "action_output"
  - "states"
  - "validation"
  - "invalidates"
  - "recovery"
  - "not_allowed"

component_decision_policy:
  if_contract_missing: "remove_or_redesign"
  keep_for_professional_appearance_only: false
  copy_reference_service_ui: false
  fixed_column_count_is_requirement: false
  preserve_domain_contracts: true

materials:
  query_source_of_truth:
    fields:
      - "scope"
      - "text_query"
      - "category_or_subset"
      - "facets"
      - "sort"
      - "layout_and_columns"
      - "page"
    execution: "server_side"
    same_semantics_for:
      - "total"
      - "facet_counts"
      - "result_rows"
      - "sort"
      - "pagination"
  replace_fixed_filters:
    current:
      - "Material class"
      - "Manufacturer/source"
      - "CAE card"
      - "Validation/release"
      - "Yield strength min/max"
    target:
      - "search scope"
      - "quick search"
      - "browse tree and subsets"
      - "server-defined contextual facets with counts"
      - "active filter chips"
      - "condition-aware result projection"
  facet_rules:
    provider:
      separate_from: "evidence_source"
    release_state:
      separate_from: "validation_availability"
    solver_compatibility:
      requires:
        - "solver"
        - "version"
        - "source model availability"
        - "mapping state"
        - "release state"
    property_range:
      visible_when:
        - "active family defines quantity"
        - "active layout exposes quantity"
        - "server returns condition-aware semantics"
  yield_facet:
    remove_from_global_default: true
    visible_when:
      - "family == metal_elastoplastic"
      - "layout supports proof_or_yield_quantity"
      - "condition, definition, unit, and source are available"
    source: "condition-aware server projection"
    prohibit:
      - "property_sets[0] as representative value"
      - "display for polymer, elastomer, composite, or ceramic"
      - "bare Yield strength label"
      - "client-only filtering of first page"
  result_table:
    prohibit:
      - "GUID, hash, or plugin key as default column"
      - "Yield as an all-family fixed column"
      - "row-level detail, graph, and card N+1 requests"
    require:
      - "form and condition"
      - "provider"
      - "release and version"
      - "layout-specific quantities"
      - "curve, model, and card availability"
  compare:
    independent_from_row_selection: true
    preserve_across_filter_changes: true
  start_modeling:
    exact_revision_pin: true
    default_unknown_family_to_metal: false

modeling:
  stages:
    - "Data"
    - "Process"
    - "Fit"
    - "Validate"
    - "Review/Release"
    - "Export"
  new_session_initial_stage: "Data"
  family_switch_in_active_session: "explicit_setup_change_with_invalidation"
  left_region_by_stage:
    Data: "sources and mapping context; collapsible when table needs width"
    Process: "specimen/curve set and ordered operation pipeline"
    Fit: "specimen/test curve set with inclusion, visibility, condition, and warning"
    Validate: "validation cases or references"
    Review/Release: "review sections or compact lineage"
    Export: "no permanent curve/statistics rail"
  dominant_evidence:
    preserve_view_state:
      - "zoom"
      - "visible_series"
      - "selected_curve"
      - "selected_candidate"
      - "plot_mode"
    prohibit_internal_method_ids: true
  data:
    state_actions:
      - "Inspect source"
      - "Confirm mapping"
      - "Save dataset"
    require:
      - "raw table and curve"
      - "source column"
      - "physical quantity"
      - "raw and normalized unit"
      - "conversion sample"
      - "test conditions and provenance"
  process:
    primary_action: "Save processed curves"
    reviewed_wording_without_review: false
    operation_palette: "compatible, purpose-grouped, human-labeled"
    replicate_analysis_visible_when: "two_or_more_compatible_replicates"
  yield_definition:
    stage: "Process"
    operation: "Elastic-plastic separation"
    visible_when: "workflow == metal_elastoplastic"
    default: "Rp0.2 derived from curve"
    alternate: "user-defined criterion"
    manual_override_requires:
      - "value"
      - "unit"
      - "reason"
    invalidates:
      - "processed_dataset"
      - "fit"
      - "validation"
      - "review"
      - "export"
    supplier_value_role: "reference_evidence_only"
  fit:
    recommendation_is_selection: false
    initial_selected_candidate: null
    explicit_row_selection_required: true
    selection_reason_required: true
    warning_ack_separate_from_reason: true
    modes:
      single:
        identity:
          - "law"
          - "parameters"
          - "fit_range"
      blend:
        identity:
          - "primary_law"
          - "secondary_law"
          - "ratio"
          - "both_parameter_sets"
          - "fit_range"
          - "extrapolation_policy"
    polymer_result_identity: "server_actual_selected_term_and_metrics"
  validate:
    separate_from_fit_metrics: true
    unsupported_label: "Not supported"
    unconfigured_policy_label: "Not configured"
  review_release:
    separate_actions:
      - "Save candidate"
      - "Submit for review"
      - "Request changes"
      - "Approve"
      - "Release"
    released_object_mutable: false
  export:
    normal_source: "current_session_exact_output_only"
    global_fallback_allowed: false
    prerequisite_checklist_required: true
    lineage:
      - "Processing Output"
      - "Material Model IR"
      - "Neutral model"
      - "Mapping preflight"
      - "Native solver card"
    mapping_states:
      - "exact"
      - "transformed"
      - "approximated"
      - "ignored"
      - "unsupported"
    preview_is_delivery: false
    delivered_artifact_fields:
      - "filename"
      - "checksum"
      - "source_revision"
      - "target_solver_and_version"
      - "actor"
      - "timestamp"

invalidation_events:
  material_or_state_or_family_changed:
    clear_current:
      - "test_data"
      - "processed_dataset"
      - "fit_candidates"
      - "decision"
      - "validation"
      - "IR"
      - "neutral"
      - "export"
    preserve_history: true
  mapping_changed:
    stale:
      - "processed_dataset"
      - "fit"
      - "validation"
      - "review"
      - "IR"
      - "neutral"
      - "export"
  process_changed:
    stale:
      - "fit"
      - "validation"
      - "review"
      - "IR"
      - "neutral"
      - "export"
  fit_configuration_changed:
    stale:
      - "candidates"
      - "decision"
      - "validation"
      - "review"
      - "IR"
      - "neutral"
      - "export"
  candidate_changed:
    stale:
      - "validation"
      - "review"
      - "IR"
      - "neutral"
      - "export"
  target_changed:
    keep:
      - "source_model"
      - "decision"
      - "source_validation"
    regenerate:
      - "target_validation"
      - "preflight"
      - "preview"
      - "artifact"

code_disposition:
  keep_and_refactor:
    - "apps/web/src/design/application-shell.tsx"
    - "apps/web/src/materials-browse-tree.tsx"
    - "apps/web/src/modeling-data-intake.tsx"
    - "apps/web/src/modeling-fit-decision.tsx"
    - "apps/web/src/engineering-curve-plot.tsx"
    - "apps/web/src/design/modeling-workspace-layout.tsx"
  split:
    - "apps/web/src/material-library.tsx"
    - "apps/web/src/common-processing-workbench.tsx"
  replace_state_model:
    - "apps/web/src/modeling-session-context.ts"
  isolate_legacy_normal_paths:
    - "apps/web/src/reference-elastoplastic-workbench.tsx"
    - "apps/web/src/reference-linear-viscoelastic-workbench.tsx"
    - "apps/web/src/reference-ogden-prony-workbench.tsx"
  rename_if_common_export_responsibility:
    current: "apps/web/src/neutral-hyperelastic-export.tsx"
    target_candidates:
      - "neutral-solver-export.tsx"
      - "solver-card-delivery.tsx"
  legacy_cleanup_after_migration:
    components:
      - "ModuleHubPage"
      - "moduleHubContent"
      - "ModuleArea"
    selectors:
      - ".module-material-grid"
      - ".module-material-card"
      - ".page-heading.module-heading"
      - ".page-stack"
      - ".page-heading"
      - ".content-card"
      - ".hero-card"
      - ".detail-hero"
      - ".compact-hero"

delete_gate:
  - "functionality moved to canonical route or component"
  - "imports, routes, tests, and CSS selectors inspected"
  - "inbound references equal zero"
  - "deep links redirect or have explicit replacement"
  - "unit, integration, E2E, and viewport checks pass"
  - "current docs and screenshot manifest updated"

delivery_order:
  - id: "UXC-00"
    outcome: "document convergence and latest-main baseline"
  - id: "UXC-01"
    outcome: "Materials query, facet, and result correctness"
  - id: "UXC-02"
    outcome: "Modeling session state and stage shell"
  - id: "UXC-03"
    outcome: "Data and Process domain components"
  - id: "UXC-04"
    outcome: "explicit Fit decision and model identity"
  - id: "UXC-05"
    outcome: "Validate, Review, and Release"
  - id: "UXC-06"
    outcome: "exact Export and traceable delivery"
  - id: "DUI-07"
    outcome: "canonical Administration"
  - id: "DUI-08"
    outcome: "real-state Activity work queue"
  - id: "DUI-09"
    outcome: "Storybook and legacy JSX/CSS cleanup"
  - id: "UXC-99"
    outcome: "commercial-readiness E2E gate"

acceptance:
  viewports:
    - "1366x768"
    - "1440x900"
    - "1920x1080"
  critical_regressions:
    - "candidate cannot be saved or submitted before explicit selection"
    - "recommendation changes never mutate selected candidate"
    - "blend identity includes both laws and ratio everywhere"
    - "polymer identity uses actual server-selected term"
    - "upstream changes invalidate all downstream current pointers"
    - "Export renders no artifact UI without current exact source"
    - "outputs from another material are never offered"
    - "server facet counts, total, and rows agree on a 10000-material fixture"
    - "Yield facet is absent for non-metal families"
    - "query, selection, zoom, and visibility restore after navigation"
    - "Reviewed, Validated, Released, and Delivered require actual audit events"
  docs_and_evidence:
    - "before and after screenshots"
    - "screenshot source SHA matches capture"
    - "authoritative docs updated in the same PR"
    - "historical evidence preserved"

stop_conditions:
  - "condition-aware property facet contract missing"
  - "actual candidate result identity missing"
  - "safe session clear or invalidation mechanism missing"
  - "review or release policy not configured"
  - "solver and version mapping not supported"
  - "validation threshold or reference not defined"

