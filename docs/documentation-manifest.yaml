version: 1
policy:
  current: "현재 코드, route, 화면 또는 운영 절차와 같은 변경 단위에서 유지"
  authoritative: "구현과 검수의 규범; 변경 시 requirement/ADR/Task 추적"
  historical: "완료 작업과 과거 evidence 보존; 현재 사용법으로 사용하지 않음"
  reference: "외부 조사와 비교 입력; 제품 자체의 계약은 아님"
