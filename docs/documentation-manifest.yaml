version: 3
policy:
  current: "현재 코드·경로·화면·운영 절차와 함께 갱신하는 문서"
  authoritative: "구현과 검수의 규범; 변경 전에 관련 요구사항·ADR·작업 근거를 확인"
  reference: "외부 조사·비교 입력과 범위가 정해진 이슈 증거; 제품 계약은 current·authoritative 문서와 활성 이슈에서 확인"
rules:
  - status: reference
    include:
      - "docs/00-research/**/*.md"
      - "docs/_incoming/2026-07-24-organic-ux-update/**/*.md"
      - "docs/17-evidence/**/*.md"
  - status: current
    include:
      - "README.md"
      - "DEVELOPMENT.md"
      - "IMPLEMENTATION_STATUS.md"
      - "docs/README.md"
      - "docs/user-guide/**/*.md"
      - "docs/admin-guide/**/*.md"
      - "apps/*/README.md"
      - "backend/migrations/README.md"
      - "contracts/README.md"
      - "deploy/*/README.md"
      - "fixtures/**/*.md"
      - "plugins/**/*.md"
      - "sdk/python/README.md"
  - status: authoritative
    include:
      - "AGENTS.md"
      - "apps/**/AGENTS.md"
      - ".agents/skills/**/*.md"
      - ".codex/skills/**/*.md"
      - "adr/**/*.md"
      - "docs/01-product/**/*.md"
      - "docs/02-requirements/**/*.md"
      - "docs/03-domain/**/*.md"
      - "docs/04-provenance/**/*.md"
      - "docs/05-architecture/**/*.md"
      - "docs/06-plugins/**/*.md"
      - "docs/07-ir/**/*.md"
      - "docs/08-contracts/**/*.md"
      - "docs/09-analytics/**/*.md"
      - "docs/10-execution/**/*.md"
      - "docs/11-security/**/*.md"
      - "docs/12-roadmap/**/*.md"
      - "docs/13-delivery/backlog.md"
      - "docs/14-testing/**/*.md"
      - "docs/15-governance/**/*.md"
      - "docs/16-repository/**/*.md"

visual_evidence:
  raster_extensions:
    - ".png"
    - ".jpg"
    - ".jpeg"
  roots:
    current: "docs/user-guide/images/current"
    frozen: "docs/17-evidence/images"
    transient: ".artifacts"
  exceptions:
    - lifecycle: current
      paths:
        - "docs/17-evidence/images/issue-289-administration-database-workflow/after/originals/administration-database-1920x1080.png"
        - "docs/17-evidence/images/issue-289-administration-database-workflow/after/originals/administration-database-2560x1440.png"
        - "docs/17-evidence/images/issue-289-administration-database-workflow/after/originals/administration-database-3840x2160.png"
    - lifecycle: frozen
      paths:
        - "docs/17-evidence/images/issue-184-high-dpi-global-implementation"
