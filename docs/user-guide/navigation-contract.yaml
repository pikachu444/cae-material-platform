version: 23
shell:
  product_header_px: {compact: 46, standard: 50, large: 54}
  generic_command_status_bands: absent
  keyboard:
    command_search: Ctrl+K
  display_density:
    task: Issue #184 production implementation of the #221-approved P2 policy
    choices: [compact, standard, large]
    default: standard
    reset: standard
    surface: existing-user-utility-menu
    html_attribute: data-display-density
    first_paint: before-react-root
    malformed_or_legacy_value: repair-to-standard
    persistence: browser-local-product-wide-active-user-and-workspace
    route_specific_setting: forbidden
    backend_account_cross_device_sync: forbidden
    automatic_viewport_dpr_resolution_selection: forbidden
    keyboard: [native-radio-selection, escape-close, focus-return-to-user-menu]
items:
  - label: Materials
    route: /materials
    guide: 18-search-first-materials.md
  - label: Modeling
    route: /modeling
    guide: 18-search-first-materials.md
  - label: Activity
    route: /activity
    guide: 10-navigation-and-troubleshooting.md
administration_workspace:
  task: Issue #159 task 2; Issue #161 semantic-button follow-up; Issue #184 semantic three-pane production transplant; Issue #208 Definition Bundle plan/apply
  routes:
    overview: /administration
    database_design: /administration/database
    definition_bundles: /administration/schema-bundles
    records_and_registration: /administration/records
    users_and_access: /administration/access
    legacy_schema: /catalog/schema
    legacy_records: /catalog/records
  access: authorized-workspace-menu-only
  normal_navigation: [Materials, Modeling, Activity]
  button_semantics:
    primitive: ux-button
    primary_action: ux-accent
    secondary_and_text_actions: neutral
    destructive_action: ux-danger
    success: status-only
    action_group: at-most-one-filled-primary
    states: [hover, focus-visible, disabled, aria-busy]
    route_and_command_behavior: unchanged
  database_design:
    topology: [object-navigator, object-list, property-editor]
    wide_allocation: flexible-object-list-with-bounded-readable-property-form
    objects: [Database, Profile, Table, Attribute, Layout, Subset, Link Type]
    lifecycle: [add, edit-as-new-revision, check, publish]
  definition_bundles:
    topology: [bounded-source-pane, elastic-locally-scrollable-plan-table, bounded-detail-and-confirmation-pane]
    visible_when: Administrator
    denied_roles: [User, Reviewer]
    source:
      file: one-json-file
      size_bytes: [1, 67108864]
      media_types: [application/json, application/schema+json, application/vnd.cmp.catalog-schema-definition-bundle+json]
      persistence: immutable-artifact-coordinates-only
      browser_storage_forbidden: [source-bytes, access-token, client-authored-actions]
    plan:
      server_authority: true
      arbitrary_schema_count: true
      dispositions: [create, update, no-change, conflict, error]
      detail: [location, impact, next-action, diagnostics, remediation]
      apply_blocked_by: [invalid-plan, conflict, error, migration-required]
    confirmation: [bundle-version, source-sha256, plan-fingerprint, action-counts, explicit-checkbox]
    apply_request: [artifact-id, artifact-sha256, plan-fingerprint, delete-missing-false, fresh-idempotency-key]
    client_actions_in_apply: forbidden
    completion: [immutable-application-read-back, exact-results, source-evidence, checksum-verified-export]
    recovery: [local-preflight-focus, retain-source-context, stale-plan-plan-again, never-replay-apply, refresh-read-back, request-correlation]
  records:
    topology: [table-navigator, record-list-or-import-table, bounded-registration-form]
    modes: [single-entry, multiple-rows]
    sources: [CSV, TSV, XLSX]
    mapping: [source-column, selected-attribute, value-type, original-unit, existing-material-state]
    validation: [required-value, value-type, unit, duplicate-code, per-row-correction]
    publication: published-revisions-only-in-material-database-search
materials_workspace:
  task: UXC-01 (server-scoped Find correction on DUI-02 workspace)
  routes:
    results: /materials
    material_datasheet: /materials/:materialId/:tab?
    exact_record_revision: /materials/records/:recordId/revisions/:revisionId
    optional_exact_pin_query: [record_id, record_revision_id, material_revision_id]
  revision_pinning:
    search_result_open: record_id-plus-record_revision_id-plus-material_revision_id
    pinned_detail: fetches-authorized-exact-record-material-and-workflow-revisions
    pinned_tabs_and_actions: preserve-exact-pin-query
    current_head_deep_link: /materials/:materialId-without-pin
    missing_or_mismatched_pin: fail-closed-with-retry-error
    states_and_property_sets: filter-to-pinned-material-revision; no-current-head-fallback
    provider_and_evidence_source: returned-as-server-scoped-fields-and-facets
  panes:
    compact_density: { navigator_px: 264, context_px: 280, navigator_range_px: [200, 360], context_range_px: [260, 480] }
    standard_density: { navigator_px: 288, context_px: 304, navigator_range_px: [216, 384], context_range_px: [280, 512] }
    large_density: { navigator_px: 312, context_px: 328, navigator_range_px: [232, 416], context_range_px: [300, 544] }
    compact_viewport_context: collapsed-or-allocation-driven-overlay
    main_min_px: 720
    persistence: viewport-class-local-storage-v5
    reset: current-density-default-independent-of-display-density-reset
    context_overlay: explicit-expansion-and-actual-allocation-less-than-1px-only
    overlay_actions: [close, escape, focus-return, open-datasheet]
  interaction:
    navigator_mode_control: local-navigator
    navigator_default: browse
    search_preserves_navigator_mode: true
    pane_visibility_control: divider-button-and-double-click-reset
    select: single-click
    open: [Enter, double-click]
    exact_revision_fallback: forbidden
    back_restores: [query, filters, sort, navigator_mode, selection, pane_layout]
    capture_ready: [aria-busy-false, server-scoped-total-page-and-material-class-facet, no-row-enrichment-requests]
  find_query:
    source_of_truth: server-side
    fields: [text_query, material_class, provider, evidence_source, sort, offset, limit]
    same_response: [total_count, page_rows, material_class_facet_counts, provider_facet_counts, evidence_source_facet_counts]
    unavailable_until_governed_projection: [validation_availability, solver_readiness, condition_aware_property_ranges]
    yield: hidden-until-metal-condition-definition-unit-source-revision-projection
modeling_workspace:
  task: DUI-04/DUI-05/DUI-06 and UXC-02~06 delivery work complete; normal path correction is Data/Process/Fit/Export; Reviewer product-role access, DUI-08A Activity queue, DUI-08B exact request entry, and DUI-09A legacy cleanup are complete
  route: /modeling
  query:
    normal_stage: [data, process, fit, export]
    governed_advanced_stage: [validate, review]
    family: [metal, polymer, elastomer]
  commands: [new-session, save-draft, undo, redo, data, process, fit, export, advanced]
  panes:
    compact_density: { navigator_px: 264, navigator_range_px: [200, 360] }
    standard_density: { navigator_px: 288, navigator_range_px: [216, 384] }
    large_density: { navigator_px: 312, navigator_range_px: [232, 416] }
    settings_placement: graph-adjacent-ribbon
    ribbon_sizing: shared-density-derived
    graph_header: separate-compact
    permanent_third_column: forbidden
    curve_specimen_rail_visible_when: [data, process, fit]
    export_curve_specimen_rail: absent
    persistence: viewport-layout-v1-and-modeling-session-v3-clearable-events
    navigator_interaction: [resize, collapse, divider-double-click-reset, explicit-reset, reload-persistence]
    navigator_reset: current-density-default-independent-of-display-density-reset
    context_overlay: actual-main-plot-allocation-less-than-1px-only
    graph_resize_contract: [frame, svg-viewbox, axes, legend, labels, pointer-hit-region]
  continuity:
    graph_remount_on_stage_change: forbidden
    autosaved_ui: [active-stage, selected-curves, selected-step, selected-preview-stage, plot-view, settings-open]
    new_session: [data-first, no-inherited-current-pointers]
    exact_pins: [material-revision, material-state-revision, test-data-revision]
    context_change: [clear-downstream-current-pointers, retain-immutable-history-as-stale]
    numerical_autocommit: forbidden
    preview_label: Preview — not saved
    activity_resume: [material-session, active-stage, exact-test-data-revision, selected-curve-identities, candidate-revision, validation-result, solver-card-revision]
  stage_ownership:
    data: [exact-test-data, mapping-profile, channel-summary, import]
    process: [processing-operations, necking-boundary, processed-preview]
    fit: [candidate-equations, residual, extrapolation]
    advanced_activity: [validation-and-review-release-governed-actions, not-normal-stage]
    export: [exact-source-checklist, required-lineage, persistent-graph, bottom-delivery-dock]
  current_status:
    dui_01_to_06: complete
    pr_124_fit_export: complete
    uxc_01: complete-bounded-server-query-slice
    uxc_02: complete-v3-session-invalidation-and-stage-shell
    uxc_03_to_06: complete-bounded
    uxc_06: exact-source-provenance-complete; historical-and-json-only-proof-null; ephemeral-preview-delivery-receipt-required
    reviewer_role_access: complete
    materials_presentation_and_query_projections: pending
    dui_07: complete
    dui_08a_activity_review_queue: complete
    dui_08b: complete-exact-material-and-solver-card-request-entry
    dui_09a: complete-legacy-review-workbench-removed
  capture_ready: [exact-test-data-loaded, server-preview-rendered, family-engine-loaded, exact-catalog-link-resolved, no-checking-loading-or-resolving-state, no-horizontal-overflow]

activity_workspace:
  task: DUI-08A role-aware review queue; DUI-09A legacy deep-link replacement
  route: /activity
  compatible_routes: [/jobs-reviews]
  sections: [needs-attention, in-progress, recent-outcomes]
  source: [authenticated-principal, effective-product-access, immutable-review-request-list, browser-local-modeling-session, browser-local-solver-card-history]
  role_visibility:
    user: [pending-review-in-progress, no-decision-controls]
    reviewer: [pending-review-needs-attention, row-review-action]
    administrator: [own-pending-review-in-progress, no-decision-controls]
  decision:
    requires: [existing-review-request, expected-manifest-sha256, non-empty-reason]
    result: returned-immutable-review-request-replaces-one-row
    release_or_publish: unavailable-in-this-queue
  recovery: [compact-loading-rows, refresh, retry, keep-entered-reason-on-decision-error]
  advanced_only: [request-id, revision-id, manifest-sha256, unavailable-display-name-limitation]
  captures: [activity-1366, activity-1440, activity-1920]
  legacy_removal:
    removed: [raw-aggregate-type-input, raw-aggregate-id-input, raw-revision-id-input, raw-manifest-sha256-input, standalone-record-decision]
    governance_remains: [operations-dashboard, release-workbench, governance-evidence-workbench]
  pending_projections: [server-delivery-receipt, full-release-package]
