    completion: [immutable-application-read-back, exact-results, checksum-and-provenance, checksum-verified-export]
    recovery: [local-preflight-focus, retain-source-context, new-source-explicit-reset, stale-plan-plan-again, never-replay-apply, refresh-read-back, request-correlation]
  records:
    topology: [compact-search-and-filter-row, dominant-record-results, intentional-bounded-record-or-import-editor]
    modes: [single-entry, multiple-rows]
    sources: [CSV, TSV, XLSX]
