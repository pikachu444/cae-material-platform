version: 14
shell:
  application_bar_px: 46
  command_bar_px: 38
  status_bar_px: 24
  keyboard:
    command_search: Ctrl+K
    cycle_regions: F6
items:
  - label: Materials
    route: /materials
    guide: 18-search-first-materials.md
  - label: Modeling
    route: /modeling
    guide: 18-search-first-materials.md
  - label: Activity
    route: /activity
    guide: 18-search-first-materials.md
materials_workspace:
  task: UXC-01 (server-scoped Find correction on DUI-02 workspace)
  routes:
    results: /materials
    material_datasheet: /materials/:materialId/:tab?
    exact_record_revision: /materials/records/:recordId/revisions/:revisionId
  panes:
    compact_1366: { navigator_px: 232, context: collapsed, main_px: 1106, main_min_px: 720 }
    standard_1440: { navigator_px: 240, context_px: 264, main_px: 908, main_min_px: 720 }
    wide_1920: { navigator_px: 272, context_px: 288, main_px: 1332, main_min_px: 720 }
    navigator_range_px: [220, 320]
    context_range_px: [260, 400]
    persistence: viewport-class-local-storage
  interaction:
    navigator_mode_control: command-bar-only
    pane_visibility_control: divider-button
    select: single-click
    open: [Enter, double-click]
    exact_revision_fallback: forbidden
    back_restores: [query, filters, sort, navigator_mode, selection, pane_layout]
    capture_ready: [aria-busy-false, server-scoped-total-page-and-material-class-facet, no-row-enrichment-requests]
  find_query:
    source_of_truth: server-side
    fields: [text_query, material_class, sort, offset, limit]
    same_response: [total_count, page_rows, material_class_facet_counts]
    unavailable_until_governed_projection: [provider, evidence_source, validation_availability, solver_readiness, condition_aware_property_ranges]
    yield: hidden-until-metal-condition-definition-unit-source-revision-projection
modeling_workspace:
  task: DUI-04/DUI-05/DUI-06 and UXC-02~05 complete; UXC-06 pending
  route: /modeling
  query:
    stage: [data, process, fit, validate, review, export]
    family: [metal, polymer, elastomer]
  commands: [new-session, save-draft, undo, redo, data, process, fit, validate, review, export]
  panes:
    navigator_range_px: [180, 240]
    compact_1366: { navigator_px: 184, main_px: 1161, settings: open }
    standard_1440: { navigator_px: 192, main_px: 1227, settings: open }
    wide_1920: { navigator_px: 208, main_px: 1691, settings: open }
    settings_placement: graph-adjacent-ribbon
    permanent_third_column: forbidden
    persistence: viewport-layout-and-modeling-session-v3-clearable-events
  continuity:
    graph_remount_on_stage_change: forbidden
    autosaved_ui: [active-stage, selected-curves, selected-step, selected-preview-stage, plot-view, settings-open]
    new_session: [data-first, no-inherited-current-pointers]
    exact_pins: [material-revision, material-state-revision, test-data-revision]
    context_change: [clear-downstream-current-pointers, retain-immutable-history-as-stale]
    numerical_autocommit: forbidden
    preview_label: Preview only · not committed
    activity_resume: [material-session, active-stage, exact-test-data-revision, selected-curve-identities, candidate-revision, validation-result, solver-card-revision]
  stage_ownership:
    data: [exact-test-data, mapping-profile, channel-summary, import]
    process: [processing-operations, necking-boundary, processed-preview]
    fit: [candidate-equations, residual, extrapolation]
    validate: [candidate-compatible-adapter, exact-plan, distinct-run-result, explicit-not-supported]
    review: [separate-submit-request-changes-approve-release, explicit-not-configured]
    export: [selected-model, observed-fit-range, persistent-graph, bottom-delivery-dock]
  current_status:
    dui_01_to_06: complete
    pr_124_fit_export: complete
    uxc_01: complete-bounded-server-query-slice
    uxc_02: complete-v3-session-invalidation-and-stage-shell
    uxc_03_to_05: complete
    uxc_06: corrective-work-pending
    dui_07_to_09: pending
  capture_ready: [exact-test-data-loaded, server-preview-rendered, family-engine-loaded, exact-catalog-link-resolved, no-checking-loading-or-resolving-state, no-horizontal-overflow]
