    mutations: [grant-supported-role, revoke-exact-assignment]
  ownership:
    public_boundary: apps/web/src/features/administration/index.ts
    routes: apps/web/src/features/administration/routes/administration-workspace.tsx
    route_state: apps/web/src/features/administration/model/administration-route-state.ts
