notes:
  - "Issue #210 adds five Modeling Process distribution-comparison originals from canonical current-source Compose. The current directory contains 100 deterministic synthetic non-production images; the five #210 current images were recaptured from audit-correction commit e460e8bd. Fifteen direct 100%-pixel crops remain in the issue-owned evidence packet rather than the current product-guide set."
  - "The issue-owned packet is docs/17-evidence/images/issue-210-scalar-distribution-fitting/visual-evidence.yaml: five exact-origin/main before originals, five live after originals, fifteen direct 100%-pixel crops, hashes, dimensions, route, browser/DPR/zoom and measured geometry. Main opened every original and crop at original resolution."
  - "The live browser journey opens the existing Modeling Process replicate analysis disclosure, focuses the lazy-loaded comparison dock, verifies Escape/focus return, selects Normal with an explicit reason, reloads, and reads back the exact immutable selection revision without changing the recommendation."
  - "At 1366x768 the open comparison disclosure temporarily yields only the Process settings ribbon so the persistent graph remains 372px high; closing the dock restores the ribbon without changing its persisted state. Page horizontal overflow is zero at all five viewports; the candidate table uses bounded local overflow only at 1366 and 1440."
  - "Automated 3840x2160 CSS geometry does not claim physical 4K readability. No 3840 physical display was available; #223 remains the product-wide physical-readability gate. Product Owner review of the registered 1920/2560/3840 originals and crops is pending, so the #210 PR must remain draft."
  - "Issue #206 adds five exact Material Curves captures and refreshes the affected Materials and Modeling Data/Process/Fit routes from canonical current-source Compose. The current directory contains 95 deterministic synthetic non-production images; 43 were captured from implementation commit e9b523a7, 48 retain the accepted #184 current-source pixels, and four fixture-dependent Solver Card/Export images retain their registered accepted baseline."
  - "The issue-owned packet is docs/17-evidence/images/issue-206-curve-channel-metadata-and-deviation/visual-evidence.yaml: 12 exact-origin/main before originals, 20 live after originals, 48 direct 100%-pixel crops, six keyboard/Evidence/metadata-absent state images, hashes, dimensions, routes, browser/DPR/zoom and exact source commit. Every original and crop was opened at original resolution."
  - "Materials Curves exposes the exact observed Test Data curve and view-only replicate Statistics curve, shared channel/unit definitions, recorded pointwise Student-t confidence evidence, keyboard/pointer tooltip parity, band toggle, exact revision and Evidence disclosure. Unknown legacy metadata remains visibly available without inferred axes, units, deviation or Fit eligibility."
  - "Automated 3840x2160 CSS geometry does not claim physical 4K readability; #223 remains unchanged. Product Owner review of the registered 1920/2560/3840 originals and crops is pending, so the #206 PR must remain draft."
  - "Issue #184 implements the Product Owner-approved P2 policy from merged PR #228: Standard is the default, Compact | Standard | Large are explicit product-wide browser-local choices scoped by active user/workspace, and Reset display density restores Standard independently from pane resets. No route, viewport, DPR, resolution, backend account, or cross-device synchronization selects density."
  - "The current directory registers 90 deterministic synthetic non-production product-route images. Eighty were recaptured from canonical Compose at Standard, browser zoom 100%, and DPR 1; ten exact Material-detail/card and delivered Export images remain the registered main baseline because the preserved append-only fixture cannot project the exact endpoint revision. They are not represented as current #184 recaptures."
  - "The issue-owned visual packet is docs/17-evidence/images/issue-184-high-dpi-global-implementation/visual-evidence.json: 59 exact-main before originals, 240 after originals across three densities, 21 direct 100%-pixel crops, 14 browser-zoom-200 originals, SHA-256, original dimensions, viewport/DPR/zoom/density/state fingerprints, and the explicit ten-image fixture boundary."
  - "The sole independent read-only visual auditor opened all 334 manifest-listed images at original resolution and matched every path, SHA-256 and PNG dimension. Available Q-01 through Q-20 states showed no new visual defect; the disposition remains CHANGES_REQUESTED solely because the ten exact datasheet/card/delivered states are absent at each of three densities (30 originals). Activity 3840 matches #221's approved centered comparison-table bound and is not a finding."
  - "The clean isolated composition reproduced an independent baseline failure before capture: seed_full_demo.py stopped on CMP-CATALOG-0004 immutable catalog identity conflict and verify_full_demo.py reported the missing polymer Recipe-to-card Bulk ZIP. The preserved canonical composition separately blocks the ten exact-revision images with CMP-CATALOG-0015. No data was reset and no verifier or contract was weakened."
  - "Q-20 geometry passes for every captured route/state: the shell spans all five CSS viewports; Materials/Data/Process/Fit/Export use elastic central work areas; Administration Database design and Records use the common semantic three-pane allocation; Activity retains a bounded readable history table; page horizontal overflow is zero in all 20 numeric Standard measurements. The ten unavailable fixture-dependent recaptures keep the overall evidence disposition incomplete rather than pass."
  - "Activity Recent outcomes uses 10 immutable server decisions, 20 browser-local solver-card activities, and 20 bounded browser-local successful recovery outcomes. The capture gate requires genuine local overflow at every registered history viewport, including 3840x2160."
  - "The active Windows displays are 2560x1440@59Hz and 2560x1600@165Hz at 96 DPI and 100% scale. No actual 3840x2160 monitor was available. Automated 3840x2160 CSS viewport and browser-zoom-200 evidence do not claim physical 4K readability; that disposition is DEFERRED_TO_223. Product Owner review of the originals is pending, so #184 remains open and its PR stays draft."
  - "UXC-04E preserves the approved flat Fit topology: compact title/stage rows, bounded curve/process navigator, six-group ribbon, graph-adjacent Candidate parameters disclosure, separate compact graph header, dominant plot, and decision-relevant legend. Issue #184 replaces historical fixed-size wording with the shared Compact/Standard/Large header, row, navigator, ribbon and graph tokens; the retired command/status bars do not consume Modeling graph space."
  - "Issue #160 Task 2 remains the source of Activity's shared compact semantic baseline and balanced 2656px comparison pane. The #161 recapture preserves that topology and adds a truthful 50-item long-history fixture so the local rail remains visible at 3840."
  - "The Task 2 Activity comparison remains recorded in docs/17-evidence/images/issue-160-activity-density/visual-evidence.yaml. Issue #184 revalidates request, long-history, decision/error and recovery states across P2 and removes the prior 4px Large/1366 local overflow through bounded identity/status/action columns and a flexible evidence column."
  - "Fit capture asserts the grouped metal rail, one-line Step 4 Fit heading, density-token-sized six-group ribbon and actions, concise source/state header, Candidate parameters source evidence, explicit selection before save, persistent graph identity, and the allocation-triggered bounded evidence overlay with close/focus return."
  - "Recommendation, engineer selection, saved result, downstream model evidence, and export eligibility remain separate states; a recommendation never mutates selection."
  - "Polymer candidate evidence exposes the actual server-produced term identity and measured range only; missing result evidence is never replaced by a fallback."
  - "Modeling Export exercises selected-output save, exact IR promotion, Neutral creation, and a terminal related-data state; an explicit unprojected Catalog state is evidence, not a silent resolved-link fallback."
  - "A late exact-model list refresh preserves a just-promoted local IR selection; capture waits for the enabled Neutral action or an already-restored exact Neutral."
  - "New session increments the parent context generation so in-flight Material/State discovery cannot repin an automatic fallback after the pin-free Data reset."
  - "The capture script rejects aria-busy, unfinished async status text, horizontal overflow, incomplete Fit candidate columns, a missing selected-fit output save, multiple primary CAE Card downloads, unacknowledged approximations, unsupported demo mappings, and a Modeling drawable below 72% of its workspace."
  - "All current images are deterministic synthetic non-production product-route captures. Storybook component-QA evidence is historical and is not part of this manifest or current-image directory."
  - "Activity is a compact Needs attention | In progress | Recent outcomes queue. The isolated Issue #160 queue shows pending exact-revision DP780 Selected model and Solver card reviews alongside preserved immutable prior outcomes. Reviewer can open the submitted row, enter a reason, and record an existing API decision; User and Administrator see their own pending requests in progress without decision controls. Failed jobs retain exact retry context."
  - "The legacy /jobs-reviews deep link renders the same Activity queue; the retired raw aggregate/revision/hash request form and standalone decision control are absent. /governance remains an Advanced Operations, Release and Governance Evidence route."
  - "The deterministic capture reuses the clean-demo Selected model review. Only when the synthetic demo has no review does it create one real review request for a draft synthetic Material; it never creates a duplicate or records a decision. The review API supplies an immutable requester display-name snapshot; the normal queue uses task labels and request reason while exact identifiers stay in Advanced evidence."
  - "DUI-08B submits or reuses one real review request for the exact draft OpenRadioss card revision already loaded by Native Card Preview. The normal header then shows Waiting for review, and Activity shows the corresponding Solver card review row; no decision or release is fabricated."
  - "Data, Process and Fit use the same compact Curves tree: the canonical test-method group is a real native disclosure above specimen/revision rows, a 3×17 px vertical plot-color swatch is placed between the inclusion checkbox and flexible label, inclusion checkbox and icon-only plot visibility remain independent, and Export has no permanent curve rail. Data overlays each visible exact Test Data revision from a server preview and persists included revisions across reload."
  - "The normal stage strip visibly contains only Data, Process, Fit and Export. Its readiness details remain in hover/focus labels; Validate and Review are Advanced/Activity governed contracts. Mean & band is absent until an ensemble preview exists."
  - "Fit retains the UXC-04 typed decision snapshot. Export recovers an exact governed Output→Material Model IR→Neutral chain, then displays the server-proven target mapping/native text and explicitly delivers one immutable card/receipt."
  - "PR #124 and DUI-01 through DUI-06 remain preserved. UXC-06C1 remains stateless; UXC-06C2 writes one immutable Solver Card and Exporting receipt/outbox event atomically. Materials CAE Card reuse remains canonical; Activity receipt projection is Not configured."
  - "UXC-00G adds the implemented User, Reviewer, and Administrator task presets. The current access screen deliberately shows readable included work instead of editable feature-grant checkboxes."
  - "UXC-01 remediation keeps Browse as the plain /materials default, moves Browse/Filters/Subsets into the local navigator, preserves that mode during Find, and removes unprojected query/context fields."
  - "Issue #159 keeps the existing MAT-EXP and MAT-DETAIL routes, verifies server-scoped Material class, Provider and Evidence source filters, uses user-facing Family capitalization, and keeps current Layout CSV values human-readable without internal identifiers on normal surfaces."
  - "Issue #159 Materials Overview keeps the response plot readable from 1366px through 3840px and exposes exact normalized response points in a compact table from 1800px upward. Issue #161 removes the former 1920px outer cap while preserving bounded navigator/context panes."
  - "Issue #159 local scroll-rail captures cover long result/tree overflow, a short six-row result without a result rail, and an empty result without a result rail; the rails are pointer-, track-, wheel-, and keyboard-operable and remain inside the Materials workspace."
  - "Issue #159 MAT-DETAIL captures map each current viewport to its approved MAT-DETAIL reference and bounded side-by-side comparison evidence; Response points reuse the shared MaterialsScrollRegion with genuine local overflow only."
  - "Issue #159 task 2 keeps Database/Profile, Table, Attribute, Layout, Subset and Link Type lifecycle controls in Administration, and gives Record registration a single/multiple-row workflow with immutable CSV/TSV/XLSX source evidence, field/unit/material-state mapping and correction before atomic registration."
  - "Normal Administration labels use user-facing names and value types. Internal identifiers, digests and exact source evidence remain outside the ordinary property editor."
  - "Issue #158 Task 1 Data captures verify three exact refs, two included and three visible after route reload, a 178 px adjustable ribbon, pin-free empty-state Local file recovery, a collapsed optional navigator that reclaims graph space, and invalid mapping that keeps the last valid graph and blocks Update preview/Save Test Data. Issue #161 replaces the former 1920×878 outer working cap with the shared elastic workspace."
  - "Issue #158 Task 3B Fit captures bind the Fit source to one saved Process Output id/revision/digest in Candidate parameters Evidence, show the server candidate response/residual/tangent and diagnostic evidence, preserve the last valid preview after an exact-source read or Fit failure, and show an explicit blocked recovery when the pinned Process Output is missing or stale; Fit save requests carry the exact source pin and never fall back to raw Test Data."
