<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex orchestration map</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 2400px; height: 1600px; margin: 0; overflow: hidden; }
    body {
      background: #f3f5f7;
      color: #162536;
      font-family: "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif;
    }
    header {
      height: 100px;
      padding: 24px 42px 18px;
      background: #ffffff;
      border-bottom: 1px solid #cbd3dc;
    }
    h1 { margin: 0 0 5px; font-size: 30px; line-height: 1.15; font-weight: 650; letter-spacing: -0.4px; }
    header p { margin: 0; color: #596777; font-size: 16px; }
    svg { display: block; width: 2400px; height: 1500px; }

    .lane { fill: #ffffff; stroke: #cdd5de; stroke-width: 1.5; }
    .lane-correction { fill: #fffafa; stroke: #e1c6c3; stroke-width: 1.5; }
    .panel { fill: #f8fafc; stroke: #c9d2dc; stroke-width: 1.5; }
    .lane-title { fill: #4e5d6c; font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
    .lane-note { fill: #697684; font-size: 14px; }

    .main-node { fill: #eaf2fb; stroke: #356b9f; stroke-width: 2.2; }
    .main-decision { fill: #eef5fb; stroke: #356b9f; stroke-width: 2.2; }
    .audit-node { fill: #fff5d9; stroke: #ad7d16; stroke-width: 2.2; }
    .writer-node { fill: #e8f6f3; stroke: #28786f; stroke-width: 2.2; }
    .review-node { fill: #f1eff8; stroke: #71668f; stroke-width: 2.2; }
    .owner-node { fill: #fff2dc; stroke: #a9671c; stroke-width: 2.2; }
    .hook-node { fill: #edf7ef; stroke: #4f805a; stroke-width: 2.2; }
    .correction-node { fill: #fff0ee; stroke: #b85c53; stroke-width: 2.2; }
    .terminal { fill: #173b63; stroke: #173b63; stroke-width: 2.2; }

    .flow { fill: none; stroke: #526779; stroke-width: 2.6; marker-end: url(#arrow); }
    .flow-fail { fill: none; stroke: #b6534c; stroke-width: 2.6; marker-end: url(#arrow-fail); }
    .flow-return { fill: none; stroke: #b6534c; stroke-width: 2.6; stroke-dasharray: 9 7; marker-end: url(#arrow-fail); }
    .label { fill: #17283a; font-size: 18px; font-weight: 650; text-anchor: middle; }
    .secondary { fill: #56687a; font-size: 14px; font-weight: 400; text-anchor: middle; }
    .terminal-label { fill: #ffffff; font-size: 18px; font-weight: 650; text-anchor: middle; }
    .edge-label { fill: #526779; font-size: 14px; font-weight: 650; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; }
    .edge-label-fail { fill: #a94741; font-size: 14px; font-weight: 650; text-anchor: middle; paint-order: stroke; stroke: #fffafa; stroke-width: 5px; }
    .actor-tag { font-size: 12px; font-weight: 750; text-anchor: middle; letter-spacing: 0.7px; }
    .tag-main { fill: #356b9f; }
    .tag-audit { fill: #9a6c0a; }
    .tag-writer { fill: #28786f; }
    .tag-review { fill: #665b86; }
    .tag-owner { fill: #995d18; }
    .tag-hook { fill: #467350; }
    .tag-correction { fill: #a94f47; }

    .agent-card { fill: #ffffff; stroke-width: 2.2; }
    .agent-main { stroke: #356b9f; }
    .agent-audit { stroke: #ad7d16; }
    .agent-writer { stroke: #28786f; }
    .agent-correction { stroke: #b85c53; }
    .agent-review { stroke: #71668f; }
    .agent-title { fill: #17283a; font-size: 22px; font-weight: 700; }
    .agent-meta { fill: #43566a; font-size: 16px; font-weight: 600; }
    .agent-desc { fill: #5c6d7d; font-size: 15px; }
    .agent-note { fill: #24384c; font-size: 16px; font-weight: 650; }
    .capacity-box { fill: #eef2f6; stroke: #8a98a6; stroke-width: 1.8; }
    .legend-box { fill: #ffffff; stroke: #cbd4dd; stroke-width: 1.5; }
    html[lang="en"] .label { font-size: 17px; }
    html[lang="en"] .agent-desc { font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1 data-ko="Codex 작업 흐름과 에이전트 오케스트레이션" data-en="Codex Workflow and Agent Orchestration">Codex 작업 흐름과 에이전트 오케스트레이션</h1>
    <p data-ko="화살표는 작업 순서만 표시하며, 오른쪽 카드의 색과 도형은 흐름 속 담당 역할과 일치합니다." data-en="Arrows show work order only. Colors and shapes match workflow nodes to the responsible role cards.">화살표는 작업 순서만 표시하며, 오른쪽 카드의 색과 도형은 흐름 속 담당 역할과 일치합니다.</p>
  </header>

    <text class="lane-title" x="1658" y="58" data-ko="3. 에이전트 구성" data-en="3. AGENT CONFIGURATION"><tspan x="1658" dy="0">3. 에이전트 구성</tspan></text>

  <script>
    const language = new URLSearchParams(window.location.search).get("lang") === "en" ? "en" : "ko";
    document.documentElement.lang = language;
    const svgNamespace = "http://www.w3.org/2000/svg";
    document.querySelectorAll("[data-ko][data-en]").forEach((element) => {
      if (element.namespaceURI !== svgNamespace) {
        element.textContent = element.dataset[language];
        return;
      }
      if (language === "en" && element.dataset.yEn) {
        element.setAttribute("y", element.dataset.yEn);
      }
      const lines = element.dataset[language].split("|");
      element.replaceChildren();
      lines.forEach((line, index) => {
        const span = document.createElementNS(svgNamespace, "tspan");
        span.setAttribute("x", element.getAttribute("x"));
        span.setAttribute("dy", index === 0 ? "0" : element.dataset.lineHeight || "21");
        span.textContent = line;
        element.appendChild(span);
      });
    });
  </script>
